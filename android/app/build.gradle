apply plugin: 'com.android.application'

def keystoreProperties = new Properties()
def configuredSigningProperties = System.getenv('SOGRIM_ANDROID_SIGNING_PROPERTIES_FILE')
def keystorePropertiesFile = configuredSigningProperties
    ? file(configuredSigningProperties)
    : new File(System.getProperty('user.home'), '.sogrim-hashbon-secrets/android-upload-key/keystore.properties')
def workspaceRoot = rootProject.projectDir.parentFile.canonicalFile
def signingPropertiesCanonical = keystorePropertiesFile.canonicalFile
def pathIsInsideWorkspace = { File candidate ->
    candidate.canonicalFile.toPath().startsWith(workspaceRoot.toPath())
}
if (pathIsInsideWorkspace(signingPropertiesCanonical)) {
    throw new GradleException('Android signing credentials must be stored outside the project workspace.')
}
def releaseSigningReady = keystorePropertiesFile.exists()
def releaseStoreFile = null
def firebasePushConfigured = file('google-services.json').exists()
def localQaBuildRequested = gradle.startParameter.taskNames.any { taskName ->
    def normalized = taskName.toLowerCase()
    normalized.contains('debug') || normalized.contains('benchmark')
}

if (releaseSigningReady) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
    for (requiredSigningProperty in ['storeFile', 'storePassword', 'keyAlias', 'keyPassword']) {
        if (!String.valueOf(keystoreProperties[requiredSigningProperty] ?: '').trim()) {
            throw new GradleException("Android signing credentials are missing ${requiredSigningProperty}.")
        }
    }
    def configuredStoreFile = new File(String.valueOf(keystoreProperties['storeFile']))
    releaseStoreFile = configuredStoreFile.isAbsolute()
        ? configuredStoreFile.canonicalFile
        : new File(signingPropertiesCanonical.parentFile, configuredStoreFile.path).canonicalFile
    if (pathIsInsideWorkspace(releaseStoreFile)) {
        throw new GradleException('Android upload key must be stored outside the project workspace.')
    }
    def signingDirectoryPath = signingPropertiesCanonical.parentFile.canonicalFile.toPath()
    def keystoreDirectoryPath = releaseStoreFile.parentFile.canonicalFile.toPath()
    if (signingDirectoryPath.startsWith(keystoreDirectoryPath) || keystoreDirectoryPath.startsWith(signingDirectoryPath)) {
        throw new GradleException('Android upload key and signing credentials must use separate private directories.')
    }
}

android {
    namespace = "com.sogrimhashbon.app"
    compileSdk = rootProject.ext.compileSdkVersion
    buildFeatures {
        buildConfig = true
    }
    defaultConfig {
        applicationId "com.sogrimhashbon.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 149
        versionName "4.21"
        buildConfigField "boolean", "FIREBASE_PUSH_CONFIGURED", firebasePushConfigured.toString()
        buildConfigField "boolean", "NATIVE_QA_WEBVIEW", "false"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (releaseSigningReady) {
            release {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile releaseStoreFile
                storePassword keystoreProperties['storePassword']
            }
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            buildConfigField "boolean", "FIREBASE_PUSH_CONFIGURED", "false"
            buildConfigField "boolean", "NATIVE_QA_WEBVIEW", "true"
        }
        release {
            minifyEnabled true
            shrinkResources true
            ndk {
                debugSymbolLevel 'SYMBOL_TABLE'
            }
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (releaseSigningReady) {
                signingConfig signingConfigs.release
            }
        }
        benchmark {
            initWith release
            applicationIdSuffix ".benchmark"
            versionNameSuffix "-benchmark"
            signingConfig signingConfigs.debug
            matchingFallbacks = ['release']
            buildConfigField "boolean", "FIREBASE_PUSH_CONFIGURED", "false"
            buildConfigField "boolean", "NATIVE_QA_WEBVIEW", "true"
        }
    }
}

tasks.configureEach { task ->
    if (task.name in ['bundleRelease', 'assembleRelease'] && !releaseSigningReady) {
        task.doFirst {
            throw new GradleException('Release signing is not configured outside the project workspace. Run npm run native:android:key first.')
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text && !localQaBuildRequested) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
