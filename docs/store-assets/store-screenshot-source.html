<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      @font-face {
        font-family: "Plex Hebrew";
        src: url("../../assets/brand/IBMPlexSansHebrew-Regular.ttf") format("truetype");
        font-weight: 400 700;
        font-display: swap;
      }
      @font-face {
        font-family: "Plex Hebrew";
        src: url("../../assets/brand/IBMPlexSansHebrew-Bold.ttf") format("truetype");
        font-weight: 800 900;
        font-display: swap;
      }
      :root {
        --ink: #102a2a;
        --teal: #0a493f;
        --accent: #25b8bd;
        --coral: #ef745f;
        --surface: #ffffff;
      }
      * { box-sizing: border-box; }
      html, body {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }
      body {
        font-family: "Plex Hebrew", Arial, sans-serif;
        color: var(--ink);
        background: linear-gradient(180deg, #ffffff 0 56%, #edf7f5 100%);
      }
      body.capture-flat { background: #ffffff; }
      body.capture-offset-1346 .page { transform: translateY(-1346px); }
      body.capture-offset-2692 .page { transform: translateY(-2692px); }
      .page {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
        height: 100%;
        padding: 92px 58px 0;
      }
      .top {
        position: relative;
        z-index: 2;
        flex: 0 0 auto;
        width: 100%;
        max-width: 1180px;
        text-align: center;
      }
      .brand {
        display: inline-flex;
        align-items: center;
        gap: 18px;
        color: var(--teal);
        font-size: 29px;
        font-weight: 900;
      }
      .brand img {
        width: 64px;
        height: 64px;
        border: 1px solid rgba(10, 73, 63, .11);
        border-radius: 17px;
        box-shadow: 0 10px 24px rgba(10, 73, 63, .12);
      }
      h1 {
        margin: 46px 0 0;
        font-size: 76px;
        font-weight: 900;
        line-height: 1.08;
        letter-spacing: 0;
      }
      p {
        margin: 24px auto 0;
        max-width: 900px;
        color: #526b67;
        font-size: 31px;
        line-height: 1.45;
      }
      .accent {
        width: 116px;
        height: 8px;
        margin: 30px auto 0;
        border-radius: 8px;
        background: linear-gradient(90deg, var(--accent), var(--coral));
      }
      .phone {
        position: relative;
        z-index: 1;
        flex: 0 0 auto;
        width: min(84%, 1010px);
        height: calc(100vh - 570px);
        margin-top: 48px;
        padding: 16px;
        overflow: hidden;
        border: 1px solid rgba(10, 73, 63, .09);
        border-radius: 56px 56px 0 0;
        background: var(--surface);
        box-shadow: 0 50px 110px rgba(10, 73, 63, .18), 0 8px 26px rgba(10, 73, 63, .08);
      }
      .phone img {
        display: block;
        width: 100%;
        height: auto;
        border-radius: 42px 42px 0 0;
      }
      .slide-event .phone {
        height: min(1900px, calc(100vh - 570px));
      }
      .glow {
        position: absolute;
        left: -15%;
        right: -15%;
        bottom: -12%;
        height: 42%;
        background: radial-gradient(ellipse at center, rgba(37, 184, 189, .16), transparent 67%);
      }
      @media (max-height: 2200px) {
        .page { padding: 58px 46px 0; }
        .brand { font-size: 23px; }
        .brand img { width: 52px; height: 52px; border-radius: 14px; }
        h1 { margin-top: 30px; font-size: 60px; }
        p { margin-top: 16px; font-size: 26px; }
        .accent { width: 96px; height: 7px; margin-top: 22px; }
        .phone {
          width: min(86%, 850px);
          height: calc(100vh - 405px);
          margin-top: 34px;
          border-radius: 46px 46px 0 0;
        }
        .phone img { border-radius: 35px 35px 0 0; }
        .slide-event .phone { height: min(1320px, calc(100vh - 405px)); }
        .slide-invite .phone { height: min(1180px, calc(100vh - 405px)); }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="top">
        <div class="brand">
          <img src="../../ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png" alt="">
          <span>&#1505;&#1493;&#1490;&#1512;&#1497;&#1501; &#1495;&#1513;&#1489;&#1493;&#1503;</span>
        </div>
        <h1 id="title"></h1>
        <p id="subtitle"></p>
        <div class="accent"></div>
      </section>
      <div class="phone"><img id="screen" alt=""></div>
      <div class="glow"></div>
    </main>
    <script type="module" src="./store-screenshot-source.mjs"></script>
  </body>
</html>
