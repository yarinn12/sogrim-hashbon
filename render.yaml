services:
  - type: web
    name: sogrim-hashbon-recovery
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    autoDeployTrigger: commit
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    maxShutdownDelaySeconds: 30
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_SPACE_ID
        value: default
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_SNAPSHOT_TABLE
        value: app_snapshots
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON_BASE64
        sync: false
      - key: ADMOB_ENABLED
        value: "false"
      - key: ADMOB_TEST_MODE
        value: "false"
      - key: ADMOB_ROLLOUT_PERCENT
        value: "0"
      - key: SPONSORED_CARDS_ENABLED
        value: "false"
      - key: GOOGLE_PLAY_PREMIUM_ENABLED
        value: "false"
