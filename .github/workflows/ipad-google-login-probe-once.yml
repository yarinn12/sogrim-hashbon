name: iPad native Google login probe
on:
  push:
    branches: [work/ipad-apple-login-probe-20261003]
    paths: [.github/workflows/ipad-google-login-probe-once.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: macos-26
    timeout-minutes: 25
    env:
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
      GOOGLE_IOS_CLIENT_ID: ${{ vars.GOOGLE_IOS_CLIENT_ID }}
      IOS_VERSION: "4.55"
      IOS_BUILD: "188"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 562c082ef3a3217150be1f9e50c87aec8202109c
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - name: Prepare isolated simulator app
        run: |
          npm ci
          npm run native:prepare
          node scripts/prepare-ios-release.mjs
      - name: Install safe simulator-only instrumentation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("ios/App/App/AppDelegate.swift")
          source = p.read_text().replace("import GoogleSignIn", "import GoogleSignIn\nimport WebKit\nimport AuthenticationServices\nimport ObjectiveC")
          # ASWebAuthenticationSession presents system UI outside the app's
          # presentedViewController chain. Observe the real start result,
          # forwarding its call unchanged; do not substitute authentication.
          observer = r'''
          extension ASWebAuthenticationSession {
              @objc dynamic func sogrimProbeStart() -> Bool {
                  let started = sogrimProbeStart()
                  print("PROBE_AUTH_SESSION_STARTED:" + String(started))
                  fflush(stdout)
                  return started
              }
          }
          '''
          assert source.count("@UIApplicationMain") == 1
          source = source.replace("@UIApplicationMain", observer + "\n@UIApplicationMain", 1)
          probe = r'''
                  if let original = class_getInstanceMethod(ASWebAuthenticationSession.self, #selector(ASWebAuthenticationSession.start)),
                     let observation = class_getInstanceMethod(ASWebAuthenticationSession.self, #selector(ASWebAuthenticationSession.sogrimProbeStart)) {
                      method_exchangeImplementations(original, observation)
                  }
                  var probeCount = 0
                  Timer.scheduledTimer(withTimeInterval: 2, repeats: true) { [weak self] timer in
                      probeCount += 1
                      if probeCount > 30 { timer.invalidate(); return }
                      guard let controller = self?.window?.rootViewController as? CAPBridgeViewController,
                            let webView = controller.webView else {
                          print("PROBE_NATIVE:no-webview")
                          return
                      }
                      let nativePresentation = controller.presentedViewController.map { String(describing: type(of: $0)) } ?? "none"
                      print("PROBE_NATIVE_PRESENTATION:" + nativePresentation)
                      fflush(stdout)
                      let script = #"""
                      (() => {
                        const button = document.querySelector('[data-account-action="google"]');
                        const rect = button?.getBoundingClientRect();
                        const hit = rect ? document.elementFromPoint(rect.x + rect.width / 2, rect.y + rect.height / 2) : null;
                        const state = {
                          protocol: location.protocol,
                          origin: location.origin,
                          pathname: location.pathname,
                          parsedPathname: new URL(location.href).pathname,
                          baseValid: (() => { try { new URL(location.href, location.origin); return true; } catch { return false; } })(),
                          secure: window.isSecureContext,
                          random: typeof crypto?.getRandomValues,
                          subtle: typeof crypto?.subtle,
                          browser: typeof window.Capacitor?.Plugins?.Browser?.open,
                          gate: !!document.getElementById('public-account-auth-gate'),
                          button: !!button,
                          disabled: button?.disabled,
                          hitAction: hit?.closest('[data-account-action]')?.getAttribute('data-account-action') || '',
                          hitTag: hit?.tagName || '',
                          hitClass: typeof hit?.className === 'string' ? hit.className : '',
                          clicked: !!window.__googleProbeClicked,
                          feedback: document.getElementById('account-auth-feedback')?.textContent || '',
                          status: document.querySelector('[data-account-auth-status]')?.textContent || ''
                        };
                        if (button && !button.disabled && !window.__googleProbeClicked) {
                          window.__googleProbeClicked = true;
                          button.click();
                        }
                        return JSON.stringify(state);
                      })()
                      """#
                      webView.evaluateJavaScript(script) { value, error in
                          if let value = value as? String {
                              print("PROBE_JS:" + value)
                              fflush(stdout)
                              if let data = value.data(using: .utf8),
                                 let state = try? JSONSerialization.jsonObject(with: data) as? [String: Any],
                                 state["clicked"] as? Bool == true {
                                  let googleConfig = GIDSignIn.sharedInstance.configuration
                                  let clientExpected = Bundle.main.object(forInfoDictionaryKey: "GIDClientID") as? String
                                  let serverExpected = Bundle.main.object(forInfoDictionaryKey: "GIDServerClientID") as? String
                                  print("PROBE_GOOGLE_CLIENT_MATCH:" + String(googleConfig?.clientID != nil && googleConfig?.clientID == clientExpected))
                                  print("PROBE_GOOGLE_SERVER_MATCH:" + String(googleConfig?.serverClientID != nil && googleConfig?.serverClientID == serverExpected))
                                  fflush(stdout)
                              }
                          }
                          if let error = error { let nativeError = error as NSError; print("PROBE_EVAL_ERROR:" + nativeError.domain + ":" + String(nativeError.code)) }
                      }
                  }
          '''
          needle = "        return true\n"
          assert source.count(needle) >= 1
          p.write_text(source.replace(needle, probe + needle, 1))
          PY
      - name: Build unsigned iPad simulator app
        run: |
          xcodebuild -resolvePackageDependencies -project ios/App/App.xcodeproj -scheme App
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -derivedDataPath build/probe CODE_SIGNING_ALLOWED=NO build > build-probe.log 2>&1 || { grep -n -A 8 "error:" build-probe.log || true; tail -30 build-probe.log; exit 1; }
      - name: Run actual native Google-button path
        run: |
          python3 - <<'PY'
          import json, subprocess, time, re
          from pathlib import Path
          listing=json.loads(subprocess.check_output(["xcrun","simctl","list","devices","available","--json"]))
          devices=[d for entries in listing["devices"].values() for d in entries if "iPad" in d["name"]]
          assert devices, "No available iPad simulator"
          device=devices[0]["udid"]
          subprocess.run(["xcrun","simctl","boot",device],check=False)
          # Fresh hosted runtimes can spend over four minutes migrating data.
          # Wait for simulator readiness before testing any application behavior.
          subprocess.run(["xcrun","simctl","bootstatus",device,"-b"],check=True,timeout=600)
          app=Path("build/probe/Build/Products/Debug-iphonesimulator/App.app")
          subprocess.run(["xcrun","simctl","install",device,str(app)],check=True)
          with Path("probe-console.log").open("w") as output:
              child=subprocess.Popen(["xcrun","simctl","launch","--console",device,"com.sogrimhashbon.app"],stdout=output,stderr=subprocess.STDOUT)
              time.sleep(70)
              result={"launchExitCode":child.poll()}
              subprocess.run(["xcrun","simctl","io",device,"screenshot","probe-ipad.png"],check=False)
              child.terminate()
              try: child.wait(timeout=5)
              except subprocess.TimeoutExpired: child.kill()
          Path("probe-launch-status.json").write_text(json.dumps(result))
          print("PROBE_LAUNCH_STATUS:"+json.dumps(result))
          raw=Path("probe-console.log").read_text(errors="replace").splitlines()
          diagnostics=[line for line in raw if any(marker in line for marker in ["Error", "error:", "reason:", "Terminating app", "exception", "failed to launch"]) and "PROBE_" not in line]
          diagnostics=[re.sub(r'https?://\S+|eyJ[A-Za-z0-9_.-]+', '[redacted]', line)[:500] for line in diagnostics[-12:]]
          Path("probe-diagnostic.log").write_text("\n".join(diagnostics))
          print("\n".join(diagnostics))
          lines=[line for line in Path("probe-console.log").read_text(errors="replace").splitlines() if "PROBE_" in line]
          Path("probe-sanitized.log").write_text("\n".join(lines)+"\n")
          print("\n".join(lines))
          assert any("PROBE_JS:" in line for line in lines), "No native WebView observation"
          assert any("PROBE_GOOGLE_CLIENT_MATCH:true" in line for line in lines), "Native Google iOS client was not initialized correctly"
          assert any("PROBE_GOOGLE_SERVER_MATCH:true" in line for line in lines), "Native Google server client was not initialized correctly"
          starts=[line.partition("PROBE_AUTH_SESSION_STARTED:")[2].strip() for line in lines if "PROBE_AUTH_SESSION_STARTED:" in line]
          assert starts == ["true"], "Native Google must successfully start exactly one system authentication session"
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ipad-native-google-probe
          path: |
            probe-sanitized.log
            probe-launch-status.json
            probe-diagnostic.log
            probe-ipad.png
          if-no-files-found: ignore
          retention-days: 7

