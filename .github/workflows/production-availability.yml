name: Production availability

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"

permissions:
  contents: read
  issues: write

concurrency:
  group: production-availability
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Verify production availability
        id: verify
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/verify-production-availability.mjs | tee production-availability.log
        env:
          PRODUCTION_BASE_URL: https://sogrim-hesbon-app.vercel.app

      - name: Record strict CDN diagnostics
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/verify-production-availability.mjs --strict | tee production-cdn.log
        env:
          PRODUCTION_BASE_URL: https://sogrim-hesbon-app.vercel.app

      - name: Verify deployment failover parity
        id: parity
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/verify-production-failover.mjs | tee production-failover.log

      - name: Open one incident issue
        if: steps.verify.outcome == 'failure' || steps.parity.outcome == 'failure'
        uses: actions/github-script@v8
        with:
          script: |
            const title = '[Production] Availability or deployment parity failed';
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            if (!existing.data.some((issue) => issue.title === title)) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: `The scheduled production check failed at ${new Date().toISOString()}. The app might be unavailable, stale, or serving different source/runtime policy across the primary and recovery origins. Open the failed workflow run for the exact boundary.`,
                labels: []
              });
            }

      - name: Close recovered incident issue
        if: steps.verify.outcome == 'success' && steps.parity.outcome == 'success'
        uses: actions/github-script@v8
        with:
          script: |
            const title = '[Production] Availability or deployment parity failed';
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            for (const issue of existing.data.filter((item) => item.title === title)) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `Recovered automatically at ${new Date().toISOString()}.`
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed'
              });
            }

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: production-availability
          path: |
            production-availability.log
            production-cdn.log
            production-failover.log
          retention-days: 7

      - name: Fail after incident handling
        if: steps.verify.outcome == 'failure' || steps.parity.outcome == 'failure'
        run: exit 1
