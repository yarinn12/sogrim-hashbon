name: Native Apple auth session return before and after
on:
  push:
    branches: [work/ios-apple-auth-session-probe-20261007]
    paths: [.github/workflows/ios-apple-auth-session-probe-once.yml]
permissions:
  contents: read
jobs:
  native:
    runs-on: macos-26
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: before
            source: 4873ddd64649dff257670ab5c96902b2df598d60
          - mode: https
            source: 03562206f727691231bdb4279038d63072374a3c
          - mode: legacy
            source: 03562206f727691231bdb4279038d63072374a3c
    env:
      PROBE_MODE: ${{ matrix.mode }}
      PROBE_FIXTURES: ${{ github.workspace }}/fixtures
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
      GOOGLE_IOS_CLIENT_ID: ${{ vars.GOOGLE_IOS_CLIENT_ID }}
      IOS_VERSION: "4.55"
      IOS_BUILD: "191"
      SOGRIM_DISABLE_PRIVATE_ENV_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.source }}
          path: app
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Select Xcode and prepare the actual native SDK
        working-directory: app
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          npm ci
          npm run native:prepare
          node scripts/prepare-ios-release.mjs
          python3 "$PROBE_FIXTURES/native-auth-session-probe.py"
      - name: Build and run the real system-session redirect with synthetic account data
        working-directory: app
        run: |
          mkdir -p build/probe
          export SOGRIM_DISABLE_PRIVATE_ENV_AUTOLOAD=1
          node "$PROBE_FIXTURES/native-auth-session-server.mjs" "$PWD" > build/probe/server.log 2>&1 &
          for n in $(seq 1 30); do grep -q PROBE_HTTP_READY build/probe/server.log && break; sleep 1; done
          grep -q PROBE_HTTP_READY build/probe/server.log
          python3 - <<'PY' > build/probe/simulator.env
          import json, subprocess
          available=json.loads(subprocess.check_output(['xcrun','simctl','list','runtimes','-j']))['runtimes']
          runtime=sorted([x for x in available if x.get('isAvailable') and '.iOS-' in x['identifier']],key=lambda x:tuple(int(v) for v in x['version'].split('.')))[-1]
          types=json.loads(subprocess.check_output(['xcrun','simctl','list','devicetypes','-j']))['devicetypes']
          device=next(x for x in types if 'iPad Pro 11' in x['name'])
          udid=subprocess.check_output(['xcrun','simctl','create','Native Apple auth probe',device['identifier'],runtime['identifier']],text=True).strip()
          print('PROBE_UDID='+udid)
          PY
          source build/probe/simulator.env
          xcrun simctl boot "$PROBE_UDID"
          xcrun simctl bootstatus "$PROBE_UDID" -b
          set -o pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination "platform=iOS Simulator,id=$PROBE_UDID" -derivedDataPath build/probe/derived build-for-testing CODE_SIGNING_ALLOWED=NO | tee build/probe/build.log
          python3 - <<'PY'
          import plistlib
          from pathlib import Path
          path=Path('ios/App/App/App.entitlements')
          entitlements=plistlib.loads(path.read_bytes())
          entitlements['application-identifier']='MA9S4L7WKS.com.sogrimhashbon.app'
          entitlements['com.apple.developer.team-identifier']='MA9S4L7WKS'
          entitlements['get-task-allow']=True
          Path('build/probe/simulator.entitlements').write_bytes(plistlib.dumps(entitlements))
          PY
          codesign --force --sign - --entitlements build/probe/simulator.entitlements build/probe/derived/Build/Products/Debug-iphonesimulator/App.app
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -destination "platform=iOS Simulator,id=$PROBE_UDID" -derivedDataPath build/probe/derived -resultBundlePath build/probe/result.xcresult test-without-building CODE_SIGNING_ALLOWED=NO | tee build/probe/test.log
          grep -q PROBE_HTTP_REDIRECT build/probe/server.log
          xcrun simctl io "$PROBE_UDID" screenshot build/probe/simulator.png
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: native-auth-session-${{ matrix.mode }}
          path: |
            app/build/probe/*.log
            app/build/probe/*.png
            app/build/probe/result.xcresult
          if-no-files-found: error
          retention-days: 14
  webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 03562206f727691231bdb4279038d63072374a3c
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - run: npm run qa:mobile -- e2e/native-auth-roundtrip.spec.mjs --project=iphone-webkit --project=ipad-webkit
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: auth-session-webkit
          path: |
            playwright-report/
            test-results/
          retention-days: 7
