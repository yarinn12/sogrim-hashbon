name: Windows unit and integration QA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-unit:
    if: ${{ github.event_name != 'workflow_dispatch' || github.ref_name != 'codex/android-anr-ram-probe-20261012' }}
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      SOGRIM_DISABLE_PRIVATE_ENV_AUTOLOAD: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run complete unit and database integration suite
        run: npm test

  android-anr-ram-probe:
    # qa-windows.yml is registered for manual dispatch on main; this route exists only on the tools branch.
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref_name == 'codex/android-anr-ram-probe-20261012' }}
    uses: ./.github/workflows/android-anr-ram-probe.yml
    with:
      app_sha: eaecfa0761aa80b3701b329b30393899510d6844
