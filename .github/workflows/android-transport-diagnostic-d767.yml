name: Diagnostic only Android ASG versus Pipe d767

on:
  push:
    branches: [codex/android-transport-diagnostic-d767-20261106]

permissions:
  contents: read
  actions: read

jobs:
  diagnostic-only-not-release-acceptance:
    if: ${{ github.repository == 'yarinn12/sogrim-hashbon' && github.ref == 'refs/heads/codex/android-transport-diagnostic-d767-20261106' && github.event.created == true && github.event.deleted == false && github.event.forced == false && github.run_attempt == 1 && github.run_number == 1 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SOGRIM_DISABLE_PRIVATE_ENV_AUTOLOAD: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
    steps:
      # This exact first push starts the diagnostic. Review before pushing.
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Checkout original application bytes
        uses: actions/checkout@v6
        with:
          ref: d7675a31fffa93699a1de65c9f786ab1ff619e30
          path: app
          persist-credentials: false
      - name: Checkout exact original QA tools
        uses: actions/checkout@v6
        with:
          ref: 1bc682b1d7b80e18d2b7701889eedf63832254e3
          path: original-tools
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Check diagnostic controls before any emulator
        run: node --test tests/androidTransportDiagnostic.test.mjs
      - name: Verify exact application and tools identity
        run: |
          set -euo pipefail
          node --input-type=module -e 'import {requireInvocation} from "./scripts/qa/android-transport-diagnostic/contract.mjs";requireInvocation(process.env)'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C original-tools rev-parse HEAD)" = '1bc682b1d7b80e18d2b7701889eedf63832254e3'
          test "$(git -C original-tools rev-parse 'HEAD^{tree}')" = 'ce1ba6f3413f65e42612d82084dc40573b789486'
          python3 scripts/qa/android-transport-diagnostic/artifact.py verify-source "$GITHUB_WORKSPACE/app"
          cp -R original-tools/scripts/qa/android-native-isolated/. app/scripts/qa/android-native-isolated/
          python3 scripts/qa/android-transport-diagnostic/artifact.py verify-source "$GITHUB_WORKSPACE/app"
      - name: Require exact installed original SDK without substitution
        run: |
          set -euo pipefail
          mkdir -p app/artifacts/android-native-isolated
          sdk_bin="$(dirname "$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -1)")"
          test -x "$sdk_bin/sdkmanager"
          "$sdk_bin/sdkmanager" --install 'platforms;android-36' 'build-tools;36.1.0' 'platform-tools' 'emulator' 'system-images;android-36.1;google_apis_playstore;x86_64' > app/artifacts/android-native-isolated/sdk-install.log 2>&1
          python3 scripts/qa/android-transport-diagnostic/artifact.py verify-sdk "$ANDROID_HOME" > app/artifacts/android-native-isolated/sdk-match.json
          echo "ANDROID_QA_AVDMANAGER=$sdk_bin/avdmanager" >> "$GITHUB_ENV"
          test -c /dev/kvm
          sudo setfacl -m "u:$USER:rw" /dev/kvm
      - name: Verify original immutable APK before boot without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --connect-timeout 15 --max-time 120 \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            "$GITHUB_API_URL/repos/yarinn12/sogrim-hashbon/actions/artifacts/13520906858/zip" \
            --output "$RUNNER_TEMP/original-d767-artifact.zip"
          python3 scripts/qa/android-transport-diagnostic/artifact.py prepare "$RUNNER_TEMP/original-d767-artifact.zip" "$GITHUB_WORKSPACE/app" > app/artifacts/android-native-isolated/original-apk-validation.log 2>&1
          "$ANDROID_HOME/build-tools/36.1.0/aapt" dump badging app/android/app/build/outputs/apk/debug/app-debug.apk > app/artifacts/android-native-isolated/apk-badging.txt
          grep -q "package: name='com.sogrimhashbon.app.debug'" app/artifacts/android-native-isolated/apk-badging.txt
          "$ANDROID_HOME/build-tools/36.1.0/apksigner" verify --print-certs app/android/app/build/outputs/apk/debug/app-debug.apk > app/original-debug-certificate.txt
      - name: Run one controlled A1 B1 A2 diagnostic and preserve every failure
        run: node scripts/qa/android-transport-diagnostic/runner.mjs
      - name: Publish diagnostic interpretation even when technical commands failed
        if: always()
        run: |
          node --input-type=module -e 'import fs from "node:fs";const p="app/artifacts/android-transport-diagnostic/diagnostic-result.json";fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,"Diagnostic only; never release acceptance.\n\n"+(fs.existsSync(p)?"```json\n"+fs.readFileSync(p,"utf8")+"\n```\n":"No complete diagnostic result; preparation/execution failed.\n"));'
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: diagnostic-only-asg-pipe-d767-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            app/artifacts/android-transport-diagnostic/
            app/artifacts/android-native-isolated/
            app/original-debug-certificate.txt
          if-no-files-found: error
          retention-days: 14
