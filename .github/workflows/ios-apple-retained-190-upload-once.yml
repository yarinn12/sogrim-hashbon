name: Complete retained signed Apple TestFlight 190
on:
  push:
    branches: [work/ios-apple-testflight-190-upload-20261006]
    paths: [.github/workflows/ios-apple-retained-190-upload-once.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: ios-testflight-${{ github.repository }}
  cancel-in-progress: false
jobs:
  complete:
    runs-on: macos-26
    timeout-minutes: 55
    env:
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      APPSTORE_ISSUER_ID: ${{ vars.APPSTORE_ISSUER_ID }}
      APPSTORE_API_KEY_ID: ${{ vars.APPSTORE_API_KEY_ID }}
      GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
      GOOGLE_IOS_CLIENT_ID: ${{ vars.GOOGLE_IOS_CLIENT_ID }}
      IOS_PROVISIONING_PROFILE: "Sogrim Hashbon App Store 2026"
      IOS_VERSION: "4.55"
      IOS_BUILD: "190"
      IOS_RELEASE_NOTES: "תוקן הטיפול בקישור החזרה מ־Apple כדי לאפשר השלמת התחברות אחרי האימות ולמנוע טעינה חוזרת של אותו קישור. עודכן הלוגו במסכי הכניסה והחשבון ללוגו הנוכחי. תיקון הכניסה עם Google נשמר."

    steps:
      - uses: actions/checkout@v6
        with:
          ref: 6e3c8e6de572d086dc497a3b69133ebe86b3a67f
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Download the original immutable signed artifact
        uses: actions/download-artifact@v6
        with:
          artifact-ids: "11442082629"
          path: retained
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: "37522973011"
      - name: Verify retained source run and unchanged IPA identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync,mkdirSync,copyFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          const get=async(path)=>{const r=await fetch('https://api.github.com/repos/yarinn12/sogrim-hashbon/'+path,{headers:{Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json'}});if(!r.ok)throw Error('Original artifact identity unavailable');return r.json();};
          const run=await get('actions/runs/37522973011');
          if(run.head_sha!=='ad79c22f3c5a8f99a19dc2724506e7d78df5a76c'||run.status!=='completed'||run.conclusion!=='failure')throw Error('Unexpected original release run');
          const a=await get('actions/artifacts/11442082629');
          if(a.expired||a.workflow_run?.id!==37522973011||a.digest!=='sha256:3a475e6aa78a52475b6b841efc30bb6a784645ee9491644dad7037ab7012245e')throw Error('Original artifact was not verified');
          const m=JSON.parse(readFileSync('retained/build/ios/release-manifest.json','utf8'));
          const bytes=readFileSync('retained/build/ios/SogrimHashbon.ipa');
          if(m.bundleId!=='com.sogrimhashbon.app'||m.version!=='4.55'||m.build!=='190'||m.teamId!=='MA9S4L7WKS'||m.sha256!=='AFDC67B319D806F5CB25FF75399DD0E034654D3502D689F44A71C2E792C785F2'||m.bytes!==12146707||bytes.length!==m.bytes||createHash('sha256').update(bytes).digest('hex').toUpperCase()!==m.sha256)throw Error('Retained signed artifact differs');
          mkdirSync('build/ios',{recursive:true});
          copyFileSync('retained/build/ios/SogrimHashbon.ipa','build/ios/SogrimHashbon.ipa');
          copyFileSync('retained/build/ios/release-manifest.json','build/ios/release-manifest.json');
          console.log('Original signed final-source IPA 190 identity and hash verified.');
          NODE
      - name: Select Xcode and reverify the retained signature
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          npm run qa:ios:artifact

      - name: Require successful source QA and an unused Apple build number
        env:
          GH_TOKEN: ${{ github.token }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          node --input-type=module <<'NODE'
          import {createAppStoreClient} from './scripts/lib/app-store-release.mjs';
          for (const [id,expected] of [[37522261357,"6e3c8e6de572d086dc497a3b69133ebe86b3a67f"],[37522261206,"6e3c8e6de572d086dc497a3b69133ebe86b3a67f"],[37528025064,"8aca8cead2db2b6c0cf5254590c8c8e4bb59543e"],[37522534428,"3a2f8107872ff5a2981b4499bcc3f99dfe3c3160"]]) {
            let accepted=false;
            for(let attempt=0;attempt<60;attempt++){
              const response=await fetch('https://api.github.com/repos/yarinn12/sogrim-hashbon/actions/runs/'+id,{
                headers:{Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json'}
              });
              if(!response.ok)throw new Error('Source QA status unavailable');
              const run=await response.json();
              if(run.head_sha!==expected)throw new Error('Unexpected verification source');
              if(run.status==='completed'){
                if(run.conclusion!=='success')throw new Error('Required source verification failed');
                accepted=true;break;
              }
              await new Promise(resolve=>setTimeout(resolve,30000));
            }
            if(!accepted)throw new Error('Source verification still pending');
          }
          const api=createAppStoreClient({issuerId:process.env.APPSTORE_ISSUER_ID,keyId:process.env.APPSTORE_API_KEY_ID,privateKey:process.env.APPSTORE_API_PRIVATE_KEY});
          const app=(await api('/v1/apps/6809952514')).data;
          if(app?.attributes?.bundleId!=='com.sogrimhashbon.app')throw new Error('Unexpected Apple app');
          let next='/v1/builds?'+new URLSearchParams({'filter[app]':app.id,'filter[preReleaseVersion.platform]':'IOS',limit:'200'});
          let maximum=0;
          for(let page=0;next&&page<20;page++){
            const result=await api(next);
            if(!Array.isArray(result.data))throw new Error('Incomplete Apple builds');
            for(const item of result.data){
              if(!/^[1-9][0-9]*$/.test(item.attributes?.version))throw new Error('Unsupported build format');
              maximum=Math.max(maximum,Number(item.attributes.version));
            }
            next=result.links?.next;
          }
          if(next||maximum>=Number(process.env.IOS_BUILD))throw new Error('Apple build number has already been consumed');
          console.log('All required source verification passed; Apple build '+process.env.IOS_BUILD+' is unused.');
          NODE

      - name: Upload app to TestFlight
        uses: apple-actions/upload-testflight-build@v5
        with:
          app-path: build/ios/SogrimHashbon.ipa
          app-type: ios
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          # The action retains a ten-minute token throughout polling. Upload only;
          # the next required step renews authentication and verifies VALID + notes.
          wait-for-processing: "false"
          backend: appstore-api

      - name: Verify Apple processing and complete TestFlight notes
        run: node scripts/complete-ios-testflight.mjs
        env:
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}

      - name: Add verified build to the existing internal testing group
        env:
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          node --input-type=module <<'NODE'
          import {createAppStoreClient} from './scripts/lib/app-store-release.mjs';
          import {createHash} from 'node:crypto';
          import {writeFileSync} from 'node:fs';
          const api=createAppStoreClient({issuerId:process.env.APPSTORE_ISSUER_ID,keyId:process.env.APPSTORE_API_KEY_ID,privateKey:process.env.APPSTORE_API_PRIVATE_KEY});
          const group='4646e3de-7401-4e70-ac32-9a00072e1376';
          const g=(await api('/v1/betaGroups/'+group)).data;
          if(g?.attributes?.name!=='Yarin Internal Testing'||g.attributes.isInternalGroup!==true)throw new Error('Unexpected internal group');
          const testers=await api('/v1/betaGroups/'+group+'/betaTesters?limit=200');
          if(testers.links?.next||testers.data?.length!==1||testers.data[0].id!=='5d2040f0-3af9-4d98-a188-fd6eeb5547db')throw new Error('Unexpected tester membership');
          if(createHash('sha256').update(String(testers.data[0].attributes?.email||'').trim().toLowerCase()).digest('hex')!=='004ec2efff572434a5fd20635e1d32b406e494a5a9ea932d539734b248143a85')throw new Error('Unexpected tester email');
          const result=await api('/v1/builds?'+new URLSearchParams({'filter[app]':'6809952514','filter[version]':process.env.IOS_BUILD,include:'preReleaseVersion',limit:'200'}));
          if(result.links?.next||result.data?.length!==1)throw new Error('Build identity not unique');
          const b=result.data[0], v=result.included?.find(x=>x.id===b.relationships?.preReleaseVersion?.data?.id&&x.type==='preReleaseVersions');
          if(b.attributes?.processingState!=='VALID'||v?.attributes?.version!==process.env.IOS_VERSION||v.attributes.platform!=='IOS')throw new Error('Build is not ready');
          await api('/v1/betaGroups/'+group+'/relationships/builds',{method:'POST',body:{data:[{type:'builds',id:b.id}]}});
          const readBack=await api('/v1/betaGroups/'+group+'/builds?limit=200');
          if(readBack.links?.next||!readBack.data?.some(x=>x.id===b.id&&x.attributes?.version===process.env.IOS_BUILD))throw new Error('Build assignment not confirmed');
          const selected=await api('/v1/appStoreVersions/3a69b968-9121-43b6-b9b5-4ea3ddf42d3a/build');
          if(selected.data?.attributes?.version!=='186')throw new Error('Unexpected App Store draft selection');
          const report={checkedAt:new Date().toISOString(),buildId:b.id,version:process.env.IOS_VERSION,build:process.env.IOS_BUILD,processingState:'VALID',assignedBuildVerified:true,existingTesterIdentityVerified:true,selectedAppStoreBuild:'186',sourceCommit:'6e3c8e6de572d086dc497a3b69133ebe86b3a67f'};
          writeFileSync('build/ios/testflight-group-finalization.json',JSON.stringify(report,null,2)+'\n');
          console.log('TESTFLIGHT_190_READY:'+JSON.stringify(report));
          console.log('TestFlight '+process.env.IOS_VERSION+' ('+process.env.IOS_BUILD+') is VALID and assigned to the existing internal group.');
          NODE

      - name: Keep IPA and diagnostics for seven days
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sogrim-hashbon-ios-190-retained-upload-final
          path: |
            build/ios/SogrimHashbon.ipa
            build/ios/release-manifest.json
            build/ios/testflight-completion.json
            build/ios/testflight-group-finalization.json
            build/ios/*.log
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 7
