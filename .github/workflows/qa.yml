name: QA

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Enforce architecture boundaries
        run: npm run qa:architecture

      - name: Run unit tests
        run: npm run qa:unit

      - name: Run integration tests
        run: npm run qa:integration

      - name: Run data capacity and contention gates
        run: npm run qa:capacity

      - name: Upload capacity diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: capacity-report
          path: artifacts/performance/
          if-no-files-found: error
          retention-days: 14

  mobile:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        project: [android-mobile, ipad-webkit, reflow-200]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Run mobile layout QA
        run: npm run qa:mobile -- --project=${{ matrix.project }}

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  mobile-iphone-webkit-shard-1:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      EXPECTED_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
      PW_QA_PORT: "4185"
      SOGRIM_DISABLE_PRIVATE_ENV_AUTOLOAD: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Run first half of iPhone WebKit QA
        run: |
          mkdir -p qa-iphone-webkit-shard
          PLAYWRIGHT_JSON_OUTPUT_FILE="$PWD/qa-iphone-webkit-shard/results.json" \
            npm run qa:mobile -- --project=iphone-webkit --shard=1/2 \
              --reporter=github,html,json --output=test-results-iphone-webkit-main
      - name: Record exact source, project and shard
        run: node scripts/qa/write-iphone-shard-receipt.mjs iphone-webkit 1
      - name: Upload first shard evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-iphone-webkit-shard-1
          path: |
            qa-iphone-webkit-shard/
            test-results-iphone-webkit-main/
            playwright-report/
          if-no-files-found: error
          retention-days: 7

  mobile-iphone-webkit-shard-2:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      EXPECTED_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
      PW_QA_PORT: "4186"
      SOGRIM_DISABLE_PRIVATE_ENV_AUTOLOAD: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Run second half of iPhone WebKit QA
        run: |
          mkdir -p qa-iphone-webkit-shard
          PLAYWRIGHT_JSON_OUTPUT_FILE="$PWD/qa-iphone-webkit-shard/results.json" \
            npm run qa:mobile -- --project=iphone-webkit --shard=2/2 \
              --reporter=github,html,json --output=test-results-iphone-webkit-main
      - name: Record exact source, project and shard
        run: node scripts/qa/write-iphone-shard-receipt.mjs iphone-webkit 2
      - name: Upload second shard evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-iphone-webkit-shard-2
          path: |
            qa-iphone-webkit-shard/
            test-results-iphone-webkit-main/
            playwright-report/
          if-no-files-found: error
          retention-days: 7

  mobile-iphone-webkit:
    name: mobile (iphone-webkit)
    if: ${{ always() }}
    needs: [unit, mobile-iphone-webkit-shard-1, mobile-iphone-webkit-shard-2]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SOGRIM_DISABLE_PRIVATE_ENV_AUTOLOAD: "1"
    steps:
      - name: Require both shards
        env:
          UNIT_RESULT: ${{ needs.unit.result }}
          SHARD_1_RESULT: ${{ needs['mobile-iphone-webkit-shard-1'].result }}
          SHARD_2_RESULT: ${{ needs['mobile-iphone-webkit-shard-2'].result }}
        run: |
          test "$UNIT_RESULT" = success
          test "$SHARD_1_RESULT" = success
          test "$SHARD_2_RESULT" = success
      - name: Checkout exact source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Download first shard evidence
        uses: actions/download-artifact@v6
        with:
          name: playwright-report-iphone-webkit-shard-1
          path: shards/1
      - name: Download second shard evidence
        uses: actions/download-artifact@v6
        with:
          name: playwright-report-iphone-webkit-shard-2
          path: shards/2
      - name: Inventory source and each planned shard
        run: |
          mkdir -p inventory
          for shard in all 1/2 2/2; do
            name="${shard//\//-}"
            if test "$shard" = all; then
              PLAYWRIGHT_JSON_OUTPUT_FILE="$PWD/inventory/$name.json" \
                npx playwright test --list --project=iphone-webkit --reporter=json
            else
              PLAYWRIGHT_JSON_OUTPUT_FILE="$PWD/inventory/$name.json" \
                npx playwright test --list --project=iphone-webkit --shard="$shard" --reporter=json
            fi
          done
      - name: Verify exact once coverage, project and source
        env:
          EXPECTED_PROJECT: iphone-webkit
          EXPECTED_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          export EXPECTED_TREE="$(git rev-parse HEAD^{tree})"
          node scripts/qa/verify-large-text-shards.mjs \
            inventory/all.json inventory/1-2.json inventory/2-2.json \
            shards/1/qa-iphone-webkit-shard/results.json shards/2/qa-iphone-webkit-shard/results.json \
            shards/1/qa-iphone-webkit-shard/receipt.json shards/2/qa-iphone-webkit-shard/receipt.json

  mobile-iphone-large-text-shard-1:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      EXPECTED_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
      PW_QA_PORT: "4183"
      SOGRIM_DISABLE_PRIVATE_ENV_AUTOLOAD: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Require whole phone actions at maximum preview and iOS accessibility size
        run: |
          for size in 32 37.64706; do
            PW_DYNAMIC_TYPE_SIZE="$size" \
              PLAYWRIGHT_JSON_OUTPUT_FILE="$PWD/test-results-large-text/$size/results.json" \
              npx playwright test e2e/iphone-landscape-proportions.spec.mjs \
                --project=iphone-large-text --output="test-results-large-text/$size" --reporter=line,json
          done
      - name: Run first half of iPhone large text QA
        run: |
          mkdir -p qa-large-text-shard
          PLAYWRIGHT_JSON_OUTPUT_FILE="$PWD/qa-large-text-shard/results.json" \
            npm run qa:mobile -- --project=iphone-large-text --shard=1/2 \
              --reporter=github,html,json --output=test-results-large-text-main
      - name: Record exact source and shard
        run: node scripts/qa/write-iphone-shard-receipt.mjs iphone-large-text 1
      - name: Upload first shard evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-iphone-large-text-shard-1
          path: |
            qa-large-text-shard/
            test-results-large-text/
            test-results-large-text-main/
            playwright-report/
          if-no-files-found: error
          retention-days: 7

  mobile-iphone-large-text-shard-2:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      EXPECTED_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
      PW_QA_PORT: "4184"
      SOGRIM_DISABLE_PRIVATE_ENV_AUTOLOAD: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Run second half of iPhone large text QA
        run: |
          mkdir -p qa-large-text-shard
          PLAYWRIGHT_JSON_OUTPUT_FILE="$PWD/qa-large-text-shard/results.json" \
            npm run qa:mobile -- --project=iphone-large-text --shard=2/2 \
              --reporter=github,html,json --output=test-results-large-text-main
      - name: Record exact source and shard
        run: node scripts/qa/write-iphone-shard-receipt.mjs iphone-large-text 2
      - name: Upload second shard evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-iphone-large-text-shard-2
          path: |
            qa-large-text-shard/
            test-results-large-text-main/
            playwright-report/
          if-no-files-found: error
          retention-days: 7

  mobile-iphone-large-text:
    name: mobile (iphone-large-text)
    if: ${{ always() }}
    needs: [unit, mobile-iphone-large-text-shard-1, mobile-iphone-large-text-shard-2]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SOGRIM_DISABLE_PRIVATE_ENV_AUTOLOAD: "1"
    steps:
      - name: Require both shards
        env:
          UNIT_RESULT: ${{ needs.unit.result }}
          SHARD_1_RESULT: ${{ needs['mobile-iphone-large-text-shard-1'].result }}
          SHARD_2_RESULT: ${{ needs['mobile-iphone-large-text-shard-2'].result }}
        run: |
          test "$UNIT_RESULT" = success
          test "$SHARD_1_RESULT" = success
          test "$SHARD_2_RESULT" = success
      - name: Checkout exact source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Download first shard evidence
        uses: actions/download-artifact@v6
        with:
          name: playwright-report-iphone-large-text-shard-1
          path: shards/1
      - name: Download second shard evidence
        uses: actions/download-artifact@v6
        with:
          name: playwright-report-iphone-large-text-shard-2
          path: shards/2
      - name: Inventory source and each planned shard
        run: |
          mkdir -p inventory
          for shard in all 1/2 2/2; do
            name="${shard//\//-}"
            if test "$shard" = all; then
              PLAYWRIGHT_JSON_OUTPUT_FILE="$PWD/inventory/$name.json" \
                npx playwright test --list --project=iphone-large-text --reporter=json
            else
              PLAYWRIGHT_JSON_OUTPUT_FILE="$PWD/inventory/$name.json" \
                npx playwright test --list --project=iphone-large-text --shard="$shard" --reporter=json
            fi
          done
      - name: Verify exact once coverage and source
        env:
          EXPECTED_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          export EXPECTED_TREE="$(git rev-parse HEAD^{tree})"
          node scripts/qa/verify-large-text-shards.mjs \
            inventory/all.json inventory/1-2.json inventory/2-2.json \
            shards/1/qa-large-text-shard/results.json shards/2/qa-large-text-shard/results.json \
            shards/1/qa-large-text-shard/receipt.json shards/2/qa-large-text-shard/receipt.json

  cross-platform-shard-1:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPECTED_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
      PW_QA_PORT: "4187"
      CROSS_PLATFORM_OUTPUT_DIR: test-results-cross-platform-shard-1
      SOGRIM_DISABLE_PRIVATE_ENV_AUTOLOAD: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install desktop comparison engines
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Run first half of cross-platform QA
        run: |
          mkdir -p qa-cross-platform-shard
          PLAYWRIGHT_JSON_OUTPUT_FILE="$PWD/qa-cross-platform-shard/results.json" \
            npm run qa:cross-platform -- --shard=1/2 --reporter=github,html,json
      - name: Record exact source and shard
        run: node scripts/qa/write-cross-platform-shard-receipt.mjs 1
      - name: Upload first shard evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: cross-platform-report-shard-1
          path: |
            qa-cross-platform-shard/
            playwright-report/
            test-results-cross-platform-shard-1/
          if-no-files-found: error
          retention-days: 14

  cross-platform-shard-2:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPECTED_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
      PW_QA_PORT: "4188"
      CROSS_PLATFORM_OUTPUT_DIR: test-results-cross-platform-shard-2
      SOGRIM_DISABLE_PRIVATE_ENV_AUTOLOAD: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install desktop comparison engines
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Run second half of cross-platform QA
        run: |
          mkdir -p qa-cross-platform-shard
          PLAYWRIGHT_JSON_OUTPUT_FILE="$PWD/qa-cross-platform-shard/results.json" \
            npm run qa:cross-platform -- --shard=2/2 --reporter=github,html,json
      - name: Record exact source and shard
        run: node scripts/qa/write-cross-platform-shard-receipt.mjs 2
      - name: Upload second shard evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: cross-platform-report-shard-2
          path: |
            qa-cross-platform-shard/
            playwright-report/
            test-results-cross-platform-shard-2/
          if-no-files-found: error
          retention-days: 14

  cross-platform:
    if: ${{ always() }}
    needs: [unit, cross-platform-shard-1, cross-platform-shard-2]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SOGRIM_DISABLE_PRIVATE_ENV_AUTOLOAD: "1"
    steps:
      - name: Require both cross-platform shards
        env:
          UNIT_RESULT: ${{ needs.unit.result }}
          SHARD_1_RESULT: ${{ needs['cross-platform-shard-1'].result }}
          SHARD_2_RESULT: ${{ needs['cross-platform-shard-2'].result }}
        run: |
          test "$UNIT_RESULT" = success
          test "$SHARD_1_RESULT" = success
          test "$SHARD_2_RESULT" = success
      - name: Checkout exact source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Download first shard evidence
        uses: actions/download-artifact@v6
        with:
          name: cross-platform-report-shard-1
          path: shards/1
      - name: Download second shard evidence
        uses: actions/download-artifact@v6
        with:
          name: cross-platform-report-shard-2
          path: shards/2
      - name: Inventory source and both planned shards
        run: |
          mkdir -p inventory
          for shard in all 1/2 2/2; do
            name="${shard//\//-}"
            if test "$shard" = all; then
              PLAYWRIGHT_JSON_OUTPUT_FILE="$PWD/inventory/$name.json" \
                npx playwright test --config playwright.cross-platform.config.mjs --list --reporter=json
            else
              PLAYWRIGHT_JSON_OUTPUT_FILE="$PWD/inventory/$name.json" \
                npx playwright test --config playwright.cross-platform.config.mjs --list --shard="$shard" --reporter=json
            fi
          done
          for project in desktop-chromium desktop-firefox desktop-webkit compact-firefox cross-engine-comparison; do
            PLAYWRIGHT_JSON_OUTPUT_FILE="$PWD/inventory/project-$project.json" \
              npx playwright test --config playwright.cross-platform.config.mjs --list --project="$project" --reporter=json
          done
      - name: Verify complete exact-once coverage and source
        env:
          EXPECTED_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          export EXPECTED_TREE="$(git rev-parse HEAD^{tree})"
          node scripts/qa/verify-cross-platform-shards.mjs \
            inventory/all.json inventory/1-2.json inventory/2-2.json \
            shards/1/qa-cross-platform-shard/results.json shards/2/qa-cross-platform-shard/results.json \
            shards/1/qa-cross-platform-shard/receipt.json shards/2/qa-cross-platform-shard/receipt.json \
            inventory/project-desktop-chromium.json inventory/project-desktop-firefox.json \
            inventory/project-desktop-webkit.json inventory/project-compact-firefox.json \
            inventory/project-cross-engine-comparison.json
      - name: Upload cross-platform coverage inventory
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: cross-platform-coverage-inventory
          path: inventory/
          if-no-files-found: error
          retention-days: 14

  two-client-sync:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Verify independent-user synchronization
        run: npm run qa:sync
      - name: Upload synchronization diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: two-client-sync-report
          path: |
            playwright-report-sync/
            test-results-sync/
          retention-days: 7

  # Preserve the existing required-check name, but fail closed if any lane
  # fails, is cancelled or skipped. The deploy workflow still waits for all QA.
  ios-native:
    needs: unit
    uses: ./.github/workflows/ios-parity-qa.yml
    with:
      app_sha: ${{ github.event.pull_request.head.sha || github.sha }}

  android-native:
    needs: unit
    uses: ./.github/workflows/android-native-parity-qa.yml
    with:
      app_sha: ${{ github.event.pull_request.head.sha || github.sha }}

  unit-and-mobile:
    if: ${{ always() }}
    needs: [unit, mobile, mobile-iphone-webkit-shard-1, mobile-iphone-webkit-shard-2, mobile-iphone-webkit, mobile-iphone-large-text-shard-1, mobile-iphone-large-text-shard-2, mobile-iphone-large-text, two-client-sync, cross-platform-shard-1, cross-platform-shard-2, cross-platform, ios-native, android-native]
    runs-on: ubuntu-latest
    steps:
      - name: Require every verification lane to pass
        env:
          UNIT_RESULT: ${{ needs.unit.result }}
          MOBILE_RESULT: ${{ needs.mobile.result }}
          IPHONE_WEBKIT_SHARD_1_RESULT: ${{ needs['mobile-iphone-webkit-shard-1'].result }}
          IPHONE_WEBKIT_SHARD_2_RESULT: ${{ needs['mobile-iphone-webkit-shard-2'].result }}
          IPHONE_WEBKIT_RESULT: ${{ needs['mobile-iphone-webkit'].result }}
          LARGE_TEXT_SHARD_1_RESULT: ${{ needs['mobile-iphone-large-text-shard-1'].result }}
          LARGE_TEXT_SHARD_2_RESULT: ${{ needs['mobile-iphone-large-text-shard-2'].result }}
          LARGE_TEXT_RESULT: ${{ needs['mobile-iphone-large-text'].result }}
          SYNC_RESULT: ${{ needs.two-client-sync.result }}
          CROSS_PLATFORM_SHARD_1_RESULT: ${{ needs['cross-platform-shard-1'].result }}
          CROSS_PLATFORM_SHARD_2_RESULT: ${{ needs['cross-platform-shard-2'].result }}
          CROSS_PLATFORM_RESULT: ${{ needs.cross-platform.result }}
          IOS_NATIVE_RESULT: ${{ needs.ios-native.result }}
          ANDROID_NATIVE_RESULT: ${{ needs.android-native.result }}
        run: |
          test "$UNIT_RESULT" = success
          test "$MOBILE_RESULT" = success
          test "$IPHONE_WEBKIT_SHARD_1_RESULT" = success
          test "$IPHONE_WEBKIT_SHARD_2_RESULT" = success
          test "$IPHONE_WEBKIT_RESULT" = success
          test "$LARGE_TEXT_SHARD_1_RESULT" = success
          test "$LARGE_TEXT_SHARD_2_RESULT" = success
          test "$LARGE_TEXT_RESULT" = success
          test "$SYNC_RESULT" = success
          test "$CROSS_PLATFORM_SHARD_1_RESULT" = success
          test "$CROSS_PLATFORM_SHARD_2_RESULT" = success
          test "$CROSS_PLATFORM_RESULT" = success
          test "$IOS_NATIVE_RESULT" = success
          test "$ANDROID_NATIVE_RESULT" = success

  backup-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Build provider-portable container
        run: docker build --tag sogrim-hashbon-backup:ci .

      - name: Start backup runtime
        run: |
          docker run --detach --rm \
            --name sogrim-hashbon-backup \
            --publish 4173:4173 \
            --env APP_PUBLIC_URL=https://backup-ci.example.com \
            --env SUPABASE_URL=https://backup-ci.supabase.co \
            --env SUPABASE_ANON_KEY=ci-public-anon-key \
            --env SUPABASE_SERVICE_ROLE_KEY=ci-private-service-key \
            --env GOOGLE_CLIENT_ID=ci-google-client-id \
            sogrim-hashbon-backup:ci

      - name: Verify backup health
        run: |
          for attempt in {1..20}; do
            if curl --fail --silent --show-error http://127.0.0.1:4173/api/health > backup-health.json; then
              cat backup-health.json
              exit 0
            fi
            sleep 1
          done
          docker logs sogrim-hashbon-backup
          exit 1

      - name: Show backup logs on failure
        if: failure()
        run: docker logs sogrim-hashbon-backup || true
