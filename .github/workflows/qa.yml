name: QA

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Set up Java for actual Activity regression tests
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm ci

      - name: Enforce architecture boundaries
        run: npm run qa:architecture

      - name: Run unit tests
        run: npm run qa:unit

      - name: Run integration tests
        run: npm run qa:integration

      - name: Run data capacity and contention gates
        run: npm run qa:capacity

      - name: Upload capacity diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: capacity-report
          path: artifacts/performance/
          if-no-files-found: error
          retention-days: 14

  mobile:
    needs: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        project: [android-mobile, ipad-webkit, reflow-200]
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      EXPECTED_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
      SOGRIM_DISABLE_PRIVATE_ENV_AUTOLOAD: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Require bounded complete source shard before browser execution
        run: |
          mkdir -p qa-mobile-shard
          PLAYWRIGHT_JSON_OUTPUT_FILE="$PWD/qa-mobile-shard/plan.json" \
            npx playwright test --list --project=${{ matrix.project }} --shard=${{ matrix.shard }}/8 --reporter=json
          node scripts/qa/verify-shard-capacity.mjs qa-mobile-shard/plan.json
      - name: Prefer official HTTPS APT mirrors on the ephemeral Ubuntu runner
        run: |
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_OS,RUNNER_ARCH,RUNNER_ENVIRONMENT \
            "$(command -v node)" scripts/qa/prepare-playwright-apt-mirrors.mjs --github-hosted-ubuntu24
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Run complete mobile source shard
        run: |
          PLAYWRIGHT_JSON_OUTPUT_FILE="$PWD/qa-mobile-shard/results.json" \
            npm run qa:mobile -- --project=${{ matrix.project }} --shard=${{ matrix.shard }}/8 --reporter=github,html,json
      - name: Record exact source, project and shard count
        run: node scripts/qa/write-iphone-shard-receipt.mjs ${{ matrix.project }} ${{ matrix.shard }} 8
      - name: Upload original shard evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-${{ matrix.project }}-shard-${{ matrix.shard }}
          path: |
            qa-mobile-shard/
            playwright-report/
            test-results/
          if-no-files-found: error
          retention-days: 14

  mobile-coverage:
    name: mobile (${{ matrix.project }})
    if: ${{ always() }}
    needs: [unit, mobile]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        project: [android-mobile, ipad-webkit, reflow-200]
    env:
      SOGRIM_DISABLE_PRIVATE_ENV_AUTOLOAD: "1"
    steps:
      - name: Require every original mobile shard
        env:
          UNIT_RESULT: ${{ needs.unit.result }}
          MOBILE_RESULT: ${{ needs.mobile.result }}
        run: |
          test "$UNIT_RESULT" = success
          test "$MOBILE_RESULT" = success
      - name: Checkout exact source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Download every original project shard
        uses: actions/download-artifact@v6
        with:
          pattern: playwright-report-${{ matrix.project }}-shard-*
          path: shards
          merge-multiple: false
      - name: Inventory complete source and all eight shards
        run: |
          mkdir -p inventory
          PLAYWRIGHT_JSON_OUTPUT_FILE="$PWD/inventory/all.json" \
            npx playwright test --list --project=${{ matrix.project }} --reporter=json
          for shard in $(seq 1 8); do
            PLAYWRIGHT_JSON_OUTPUT_FILE="$PWD/inventory/$shard-8.json" \
              npx playwright test --list --project=${{ matrix.project }} --shard="$shard/8" --reporter=json
          done
      - name: Require complete exact-once source coverage
        env:
          EXPECTED_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
          EXPECTED_PROJECT: ${{ matrix.project }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          export EXPECTED_TREE="$(git rev-parse HEAD^{tree})"
          node scripts/qa/verify-large-text-shards.mjs --shard-count 8 inventory shards
      - name: Retain complete coverage inventory
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: mobile-coverage-${{ matrix.project }}
          path: inventory/
          if-no-files-found: error
          retention-days: 14

