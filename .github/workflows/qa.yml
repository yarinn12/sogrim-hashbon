name: QA

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit-and-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit and integration tests
        run: npm test

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Run mobile layout QA
        run: npm run qa:mobile

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  backup-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build provider-portable container
        run: docker build --tag sogrim-hashbon-backup:ci .

      - name: Start backup runtime
        run: |
          docker run --detach --rm \
            --name sogrim-hashbon-backup \
            --publish 4173:4173 \
            sogrim-hashbon-backup:ci

      - name: Verify backup health
        run: |
          for attempt in {1..20}; do
            if curl --fail --silent --show-error http://127.0.0.1:4173/api/health > backup-health.json; then
              cat backup-health.json
              exit 0
            fi
            sleep 1
          done
          docker logs sogrim-hashbon-backup
          exit 1

      - name: Show backup logs on failure
        if: failure()
        run: docker logs sogrim-hashbon-backup || true
