name: iOS TestFlight
run-name: iOS TestFlight ${{ inputs.version }} (${{ inputs.build }})

on:
  workflow_dispatch:
    inputs:
      version:
        description: App Store version
        required: true
        default: "3.38"
      build:
        description: Unique TestFlight build number
        required: true
        default: "61"
      release_notes:
        description: Hebrew TestFlight release notes
        required: true
        default: "גרסת TestFlight ראשונה לבדיקת אירועים, הוצאות, הזמנות וסיכום העברות."

permissions:
  contents: read

concurrency:
  group: ios-testflight-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build-and-upload:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      APPSTORE_ISSUER_ID: ${{ vars.APPSTORE_ISSUER_ID }}
      APPSTORE_API_KEY_ID: ${{ vars.APPSTORE_API_KEY_ID }}
      IOS_VERSION: ${{ inputs.version }}
      IOS_BUILD: ${{ inputs.build }}
      IOS_RELEASE_NOTES: ${{ inputs.release_notes }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Validate Apple configuration
        run: node scripts/verify-ios-workflow-env.mjs
        env:
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          APPSTORE_CERTIFICATES_FILE_BASE64: ${{ secrets.APPSTORE_CERTIFICATES_FILE_BASE64 }}
          APPSTORE_CERTIFICATES_PASSWORD: ${{ secrets.APPSTORE_CERTIFICATES_PASSWORD }}

      - name: Select and verify Xcode 26.6
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install dependencies
        run: npm ci

      - name: Run release checks
        run: |
          npm test
          npm run native:ios:flatten-icon
          npm run native:prepare

      - name: Prepare Apple release settings
        run: node scripts/prepare-ios-release.mjs

      - name: Verify prepared iOS release
        run: npm run qa:ios

      - name: Import Apple Distribution certificate
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.APPSTORE_CERTIFICATES_FILE_BASE64 }}
          p12-password: ${{ secrets.APPSTORE_CERTIFICATES_PASSWORD }}

      - name: Download App Store provisioning profile
        uses: apple-actions/download-provisioning-profiles@v4
        with:
          bundle-id: com.sogrimhashbon.app
          profile-type: IOS_APP_STORE
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project ios/App/App.xcodeproj -scheme App

      - name: Archive signed iOS app
        run: |
          mkdir -p build/ios
          set -o pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/ios/SogrimHashbon.xcarchive \
            clean archive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            | tee build/ios/archive.log

      - name: Export IPA
        run: |
          set -o pipefail
          xcodebuild \
            -exportArchive \
            -archivePath build/ios/SogrimHashbon.xcarchive \
            -exportOptionsPlist ios/ExportOptions.generated.plist \
            -exportPath build/ios/export \
            | tee build/ios/export.log
          ipa_path="$(find build/ios/export -maxdepth 2 -name '*.ipa' -print -quit)"
          test -n "$ipa_path"
          cp "$ipa_path" build/ios/SogrimHashbon.ipa

      - name: Upload app to TestFlight
        uses: apple-actions/upload-testflight-build@v4
        with:
          app-path: build/ios/SogrimHashbon.ipa
          app-type: ios
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          release-notes: ${{ inputs.release_notes }}
          uses-non-exempt-encryption: "false"
          wait-for-processing: "true"
          backend: appstore-api

      - name: Keep IPA and diagnostics for seven days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sogrim-hashbon-ios-${{ inputs.version }}-${{ inputs.build }}
          path: |
            build/ios/SogrimHashbon.ipa
            build/ios/*.log
          if-no-files-found: warn
          retention-days: 7
