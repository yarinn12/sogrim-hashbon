name: iOS193 owner availability
run-name: iOS193 owner access audit
on:
  push:
    branches: [codex/ios193-owner-access-20261013]
    paths: [.github/workflows/ios-testflight.yml, scripts/qa/ios-signing/owner-access-audit.mjs]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ios-testflight-${{ github.repository }}
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
        working-directory: app
    env:
      SOURCE_SHA: bf254b5235deb706234b00362e6eaea78e129e98
      SOURCE_QA_RUN: '38300391028'
      SOURCE_WINDOWS_QA_RUN: '38300390654'
      SOURCE_FONT_QA_RUN: '38300390653'
      SOURCE_AUTH_QA_RUN: '38300390656'
      APPLE_TEAM_ID: MA9S4L7WKS
      APPSTORE_ISSUER_ID: ${{ vars.APPSTORE_ISSUER_ID }}
      APPSTORE_API_KEY_ID: ${{ vars.APPSTORE_API_KEY_ID }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: bf254b5235deb706234b00362e6eaea78e129e98
          path: app
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          path: release-tools
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Verify frozen source and all CI without product execution
        env:
          GH_TOKEN: ${{ github.token }}
        run: node "$GITHUB_WORKSPACE/release-tools/scripts/qa/ios-signing/intake-readonly-ci.mjs"
      - name: Read only the existing owner group and original processed193
        env:
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: node "$GITHUB_WORKSPACE/release-tools/scripts/qa/ios-signing/owner-access-audit.mjs"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ios193-owner-access-audit-${{ github.run_id }}
          path: app/build/ios/owner-access-audit.json
          if-no-files-found: warn
          retention-days: 7
