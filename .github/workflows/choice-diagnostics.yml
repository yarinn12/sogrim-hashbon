name: Choice interaction diagnostics

on:
  push:
    branches: [codex/recovery-diagnostics-2026-09-30]

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: [iphone-webkit, ipad-webkit]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - name: Repeat the unchanged journey with input event diagnostics
        run: npx playwright test e2e/ipad-diagnostic.spec.mjs --project=${{ matrix.project }} --grep 'participant identity uses' --repeat-each=20 --retries=0
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: choice-diagnostic-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
