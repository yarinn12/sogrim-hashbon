name: Shared event reference regression
on:
  push:
    branches: [codex/shared-event-reference-20261013]
permissions:
  contents: read
concurrency:
  group: shared-event-reference-${{ github.ref }}
  cancel-in-progress: false
jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Preserve first Notes action at full 32px and measured iOS AX root
        run: |
          for size in 32 37.64706; do
            PW_DYNAMIC_TYPE_SIZE="$size" PLAYWRIGHT_JSON_OUTPUT_FILE="reference-evidence/notes-$size.json" \
              npx playwright test e2e/iphone-landscape-proportions.spec.mjs --project=iphone-large-text \
                --grep "portrait notes" --output="reference-notes-$size" --retries=0 --reporter=line,json
          done
      - name: Compare the shared header with the user reference
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: reference-evidence/results.json
        run: npx playwright test e2e/user-reference-event-layout.spec.mjs --project=android-mobile --project=iphone-webkit --project=ipad-webkit --project=iphone-large-text --project=reflow-200 --retries=0 --reporter=line,html,json
      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: shared-event-reference-${{ github.sha }}
          path: |
            reference-evidence/
            playwright-report/
            test-results/
            reference-notes-*/
          retention-days: 7
          if-no-files-found: error
