name: iOS Google recovery verified upload 188
run-name: Verified Google recovery 4.55 (188)

on:
  push:
    branches: [work/ios-google-auth-testflight-188-20261006]
    paths: [.github/workflows/ios-google-auth-testflight-188-once.yml]

permissions:
  contents: read
  actions: read

concurrency:
  group: ios-testflight-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build-and-upload:
    runs-on: macos-26
    timeout-minutes: 75
    env:
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      APPSTORE_ISSUER_ID: ${{ vars.APPSTORE_ISSUER_ID }}
      APPSTORE_API_KEY_ID: ${{ vars.APPSTORE_API_KEY_ID }}
      GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
      GOOGLE_IOS_CLIENT_ID: ${{ vars.GOOGLE_IOS_CLIENT_ID }}
      IOS_PROVISIONING_PROFILE: "Sogrim Hashbon App Store 2026"
      IOS_VERSION: "4.55"
      IOS_BUILD: "188"
      IOS_RELEASE_NOTES: "שופרה ההתחברות עם Google באייפון ובאייפד: אם ההתחברות הראשונית לא הושלמה, נפתח חלון Google נוסף להשלמת הכניסה. הוסרה המלצה כללית לעדכון האפליקציה מתוך הודעת ההתחברות."

    steps:
      - name: Checkout verified authentication source
        uses: actions/checkout@v6
        with:
          ref: 562c082ef3a3217150be1f9e50c87aec8202109c
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Select and verify Xcode 26.6
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version

      - name: Verify the existing signed build provenance and successful Mac checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          const get=async path=>{
            const response=await fetch('https://api.github.com/repos/yarinn12/sogrim-hashbon'+path,{headers:{Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json'}});
            if(!response.ok)throw new Error('Signed build provenance is unavailable');
            return response.json();
          };
          const run=await get('/actions/runs/37467886875');
          if(run.head_sha!=='6cb04278228aac65a960d4ed770a65702158ad08'||run.status!=='completed'||run.conclusion!=='failure')throw new Error('Unexpected original build run');
          const jobs=await get('/actions/runs/37467886875/jobs?per_page=100');
          if(jobs.jobs?.length!==1)throw new Error('Unexpected original build jobs');
          const steps=jobs.jobs[0].steps;
          function requireStep(name, conclusion){
            const matching=steps.filter(s=>s.name===name);
            if(matching.length!==1||matching[0].conclusion!==conclusion)throw new Error('Original build step was not verified: '+name);
          }
          for(const name of ['Checkout verified authentication source','Run release checks','Verify Google recovery, Apple and email on iPhone and iPad WebKit','Prepare Apple release settings','Verify prepared iOS release','Archive signed iOS app','Export IPA','Verify signed iOS artifact'])requireStep(name,'success');
          requireStep('Require successful source QA and an unused Apple build number','failure');
          for(const name of ['Upload app to TestFlight','Verify Apple processing and complete TestFlight notes','Add verified build to the existing internal testing group'])requireStep(name,'skipped');
          const artifact=await get('/actions/artifacts/11415519328');
          if(artifact.id!==11415519328||artifact.name!=='sogrim-hashbon-ios-4.55-188'||artifact.expired||artifact.workflow_run?.id!==run.id||artifact.workflow_run?.head_sha!==run.head_sha||artifact.digest!=='sha256:3a759109535e33cbcbeb40c6dbda9aa237b03ca65d30961b17afc6c5170b451e')throw new Error('Unexpected signed build artifact');
          console.log('Verified signed build provenance and successful original Mac checks; original upload was skipped.');
          NODE

      - name: Retrieve the immutable signed build
        uses: actions/download-artifact@v6
        with:
          artifact-ids: '11415519328'
          github-token: ${{ github.token }}
          repository: yarinn12/sogrim-hashbon
          run-id: '37467886875'
          path: .
          merge-multiple: true

      - name: Verify the exact signed IPA checksum and manifest
        run: |
          node --input-type=module <<'NODE'
          import {readFile} from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          const bytes=await readFile('build/ios/SogrimHashbon.ipa');
          const sha256=createHash('sha256').update(bytes).digest('hex').toUpperCase();
          const manifest=JSON.parse(await readFile('build/ios/release-manifest.json','utf8'));
          if(sha256!=='B8731FE1EE10DF163E332FDBAD4ADFD22A24F46F6D872C6CEC077A9699095F60'||manifest.sha256!==sha256||bytes.length!==12134471||manifest.bytes!==bytes.length||manifest.bundleId!=='com.sogrimhashbon.app'||manifest.version!=='4.55'||manifest.build!=='188'||manifest.teamId!=='MA9S4L7WKS')throw new Error('Signed IPA checksum or manifest mismatch');
          console.log('Exact signed IPA checksum and manifest verified.');
          NODE

      - name: Reverify the signed iOS artifact before upload
        run: node scripts/verify-ios-artifact.mjs


      - name: Require successful source QA and an unused Apple build number
        env:
          GH_TOKEN: ${{ github.token }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          node --input-type=module <<'NODE'
          import {createAppStoreClient} from './scripts/lib/app-store-release.mjs';
          for (const [id,expected] of [[37458278976,'562c082ef3a3217150be1f9e50c87aec8202109c'],[37458278979,'562c082ef3a3217150be1f9e50c87aec8202109c'],[37467348496,'c4508043203909e1dbf6952204fabc33006c2a89'],[37470528479,'d2962f98e09a1996b9327c0d3a94466cbe4e228d'],[37467348757,'c4508043203909e1dbf6952204fabc33006c2a89'],[37467348614,'c4508043203909e1dbf6952204fabc33006c2a89']]) {
            let accepted=false;
            for(let attempt=0;attempt<60;attempt++){
              const response=await fetch('https://api.github.com/repos/yarinn12/sogrim-hashbon/actions/runs/'+id,{
                headers:{Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json'}
              });
              if(!response.ok)throw new Error('Source QA status unavailable');
              const run=await response.json();
              if(run.head_sha!==expected)throw new Error('Unexpected verification source');
              if(run.status==='completed'){
                if(run.conclusion!=='success')throw new Error('Required source verification failed');
                accepted=true;break;
              }
              await new Promise(resolve=>setTimeout(resolve,30000));
            }
            if(!accepted)throw new Error('Source verification still pending');
          }
          const api=createAppStoreClient({issuerId:process.env.APPSTORE_ISSUER_ID,keyId:process.env.APPSTORE_API_KEY_ID,privateKey:process.env.APPSTORE_API_PRIVATE_KEY});
          const app=(await api('/v1/apps/6809952514')).data;
          if(app?.attributes?.bundleId!=='com.sogrimhashbon.app')throw new Error('Unexpected Apple app');
          let next='/v1/builds?'+new URLSearchParams({'filter[app]':app.id,'filter[preReleaseVersion.platform]':'IOS',limit:'200'});
          let maximum=0;
          for(let page=0;next&&page<20;page++){
            const result=await api(next);
            if(!Array.isArray(result.data))throw new Error('Incomplete Apple builds');
            for(const item of result.data){
              if(!/^[1-9][0-9]*$/.test(item.attributes?.version))throw new Error('Unsupported build format');
              maximum=Math.max(maximum,Number(item.attributes.version));
            }
            next=result.links?.next;
          }
          if(next||maximum>=Number(process.env.IOS_BUILD))throw new Error('Apple build number has already been consumed');
          console.log('All required source verification passed; Apple build '+process.env.IOS_BUILD+' is unused.');
          NODE

      - name: Upload app to TestFlight
        uses: apple-actions/upload-testflight-build@v5
        with:
          app-path: build/ios/SogrimHashbon.ipa
          app-type: ios
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          # The action retains a ten-minute token throughout polling. Upload only;
          # the next required step renews authentication and verifies VALID + notes.
          wait-for-processing: "false"
          backend: appstore-api

      - name: Verify Apple processing and complete TestFlight notes
        run: node scripts/complete-ios-testflight.mjs
        env:
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}

      - name: Add verified build to the existing internal testing group
        env:
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          node --input-type=module <<'NODE'
          import {createAppStoreClient} from './scripts/lib/app-store-release.mjs';
          const api=createAppStoreClient({issuerId:process.env.APPSTORE_ISSUER_ID,keyId:process.env.APPSTORE_API_KEY_ID,privateKey:process.env.APPSTORE_API_PRIVATE_KEY});
          const group='4646e3de-7401-4e70-ac32-9a00072e1376';
          const g=(await api('/v1/betaGroups/'+group)).data;
          if(g?.attributes?.name!=='Yarin Internal Testing'||g.attributes.isInternalGroup!==true)throw new Error('Unexpected internal group');
          const testers=await api('/v1/betaGroups/'+group+'/betaTesters?limit=200');
          if(testers.links?.next||testers.data?.length!==1||testers.data[0].id!=='5d2040f0-3af9-4d98-a188-fd6eeb5547db')throw new Error('Unexpected tester membership');
          const result=await api('/v1/builds?'+new URLSearchParams({'filter[app]':'6809952514','filter[version]':process.env.IOS_BUILD,include:'preReleaseVersion',limit:'200'}));
          if(result.links?.next||result.data?.length!==1)throw new Error('Build identity not unique');
          const b=result.data[0], v=result.included?.find(x=>x.id===b.relationships?.preReleaseVersion?.data?.id&&x.type==='preReleaseVersions');
          if(b.attributes?.processingState!=='VALID'||v?.attributes?.version!==process.env.IOS_VERSION||v.attributes.platform!=='IOS')throw new Error('Build is not ready');
          await api('/v1/betaGroups/'+group+'/relationships/builds',{method:'POST',body:{data:[{type:'builds',id:b.id}]}});
          console.log('TestFlight '+process.env.IOS_VERSION+' ('+process.env.IOS_BUILD+') is VALID and assigned to the existing internal group.');
          NODE

      - name: Keep IPA and diagnostics for seven days
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sogrim-hashbon-ios-${{ env.IOS_VERSION }}-${{ env.IOS_BUILD }}
          path: |
            build/ios/SogrimHashbon.ipa
            build/ios/release-manifest.json
            build/ios/testflight-completion.json
            build/ios/*.log
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 7

