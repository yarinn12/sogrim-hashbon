name: iPad Apple callback replay before and after
on:
  push:
    branches: [work/ios-apple-callback-probe-20261006]
    paths: [.github/workflows/ipad-apple-callback-replay-probe-once.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: macos-26
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: before
            source: f031475c8c8fa5d91e4d074040a8f66527bdf1ef
          - label: fixed
            source: 6e3c8e6de572d086dc497a3b69133ebe86b3a67f
    env:
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
      GOOGLE_IOS_CLIENT_ID: ${{ vars.GOOGLE_IOS_CLIENT_ID }}
      IOS_VERSION: "4.55"
      IOS_BUILD: "190"
      PROBE_LABEL: ${{ matrix.label }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.source }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - name: Prepare isolated simulator app
        run: |
          npm ci
          npm run native:prepare
          node scripts/prepare-ios-release.mjs
      - name: Observe actual Apple browser and native callback delivery
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('ios/App/App/AppDelegate.swift')
          source=p.read_text().replace('import GoogleSignIn','import GoogleSignIn\nimport WebKit')
          probe=r'''
                  var probeCount = 0
                  var callbackInjected = false
                  var injectedAt: TimeInterval = 0
                  var evaluating = false
                  var reloadCount = 0
                  var observation: NSKeyValueObservation?
                  var expectedCallback: URL?
                  var safariPresented = false
                  var lastState: [String: Any] = [:]
                  Timer.scheduledTimer(withTimeInterval: 2, repeats: true) { [weak self] timer in
                      probeCount += 1
                      if probeCount > 150 { timer.invalidate(); return }
                      guard let controller = self?.window?.rootViewController as? CAPBridgeViewController,
                            let webView = controller.webView else { print("PROBE_CALLBACK:no-webview"); fflush(stdout); return }
                      if observation == nil {
                          observation = webView.observe(\.isLoading, options: [.new]) { _, change in
                              if callbackInjected && change.newValue == true {
                                  reloadCount += 1
                                  print("PROBE_CALLBACK_RELOAD:" + String(reloadCount))
                                  fflush(stdout)
                              }
                          }
                      }
                      let presentation = controller.presentedViewController.map { String(describing: type(of: $0)) } ?? "none"
                      if presentation == "SFSafariViewController" { safariPresented = true }
                      let elapsed = callbackInjected ? ProcessInfo.processInfo.systemUptime - injectedAt : 0
                      let fixedReady = (lastState["ready"] as? Bool == true) && (lastState["feedback"] as? Bool == true) && (lastState["retainedLaunch"] as? Bool == true)
                      if callbackInjected && elapsed >= 16 && (reloadCount >= 2 || fixedReady || elapsed >= 90) {
                          let report: [String: Any] = [
                              "reloads": reloadCount,
                              "proxyRetainsCallback": ApplicationDelegateProxy.shared.lastURL == expectedCallback,
                              "ready": lastState["ready"] as? Bool ?? false,
                              "feedback": lastState["feedback"] as? Bool ?? false,
                              "mark": lastState["mark"] as? String ?? "",
                              "markLoaded": lastState["markLoaded"] as? Bool ?? false,
                              "retainedLaunch": lastState["retainedLaunch"] as? Bool ?? false
                          ]
                          if let json = try? JSONSerialization.data(withJSONObject: report), let text = String(data: json, encoding: .utf8) {
                              print("PROBE_CALLBACK_FINAL:" + text)
                              fflush(stdout)
                          }
                          timer.invalidate()
                          return
                      }
                      if evaluating { return }
                      evaluating = true
                      let script = #"""
                      (() => {
                        const button = document.querySelector('[data-account-action="apple"]');
                        const image = document.querySelector('.account-auth-mark img');
                        if (button && !button.disabled && !sessionStorage.getItem('probe-apple-started')) {
                          sessionStorage.setItem('probe-apple-started', '1');
                          button.click();
                        }
                        const flowKeys = Object.keys(localStorage).filter(k => k.startsWith('settle-friends-account-oauth-flow:'));
                        const flow = flowKeys.map(k => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } }).filter(Boolean).sort((a,b) => b.createdAt-a.createdAt)[0];
                        window.Capacitor?.Plugins?.App?.getLaunchUrl?.().then(result => {
                          const url = result?.url ? new URL(result.url) : null;
                          window.__probeRetainedLaunch = !!url && url.pathname === '/auth/callback' && url.searchParams.get('error') === 'access_denied';
                        });
                        return JSON.stringify({
                          ready: !!button && !button.disabled,
                          flowId: flow?.id || '',
                          feedback: (document.getElementById('account-auth-feedback')?.textContent || '').includes('ההתחברות לא הושלמה'),
                          mark: image?.getAttribute('src') || '',
                          markLoaded: !!image?.complete && image.naturalWidth > 0,
                          retainedLaunch: !!window.__probeRetainedLaunch
                        });
                      })()
                      """#
                      webView.evaluateJavaScript(script) { value, error in
                          evaluating = false
                          if let error = error { let e = error as NSError; print("PROBE_CALLBACK_EVAL_ERROR:" + e.domain + ":" + String(e.code) + ":" + e.localizedDescription.replacingOccurrences(of: "https?://[^\\s]+|eyJ[A-Za-z0-9_.-]+", with: "[redacted]", options: .regularExpression)); fflush(stdout) }
                          guard let text = value as? String,
                                let data = text.data(using: .utf8),
                                let state = try? JSONSerialization.jsonObject(with: data) as? [String: Any] else { return }
                          lastState = state
                          if !callbackInjected, safariPresented, let flowId = state["flowId"] as? String, !flowId.isEmpty {
                              var components = URLComponents(string: "https://sogrim-hesbon-app.vercel.app/auth/callback")!
                              components.queryItems = [URLQueryItem(name: "error", value: "access_denied"), URLQueryItem(name: "auth_flow", value: flowId)]
                              expectedCallback = components.url!
                              let activity = NSUserActivity(activityType: NSUserActivityTypeBrowsingWeb)
                              activity.webpageURL = expectedCallback
                              callbackInjected = true
                              injectedAt = ProcessInfo.processInfo.systemUptime
                              // Exercise Capacitor's actual proxy/App plugin. The synthetic
                              // provider error contains no identity token/code/account data.
                              let accepted = ApplicationDelegateProxy.shared.application(UIApplication.shared, continue: activity, restorationHandler: { _ in })
                              print("PROBE_CALLBACK_DELIVERED:" + String(accepted))
                              print("PROBE_CALLBACK_APPLE_BROWSER:" + String(safariPresented))
                              fflush(stdout)
                          }
                      }
                  }
          '''
          needle='        return true\n'
          assert source.count(needle)>=1
          p.write_text(source.replace(needle,probe+needle,1))
          PY
      - name: Build unsigned iPad simulator app
        run: |
          xcodebuild -resolvePackageDependencies -project ios/App/App.xcodeproj -scheme App
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -derivedDataPath build/probe CODE_SIGNING_ALLOWED=NO build > build-probe.log 2>&1 || { grep -n -A 8 "error:" build-probe.log || true; tail -30 build-probe.log; exit 1; }
      - name: Verify real native callback behavior and current logo
        run: |
          python3 - <<'PY'
          import json,subprocess,time,os,re
          from pathlib import Path
          listing=json.loads(subprocess.check_output(['xcrun','simctl','list','devices','available','--json']))
          devices=[d for items in listing['devices'].values() for d in items if 'iPad' in d['name']]
          assert devices,'No available iPad simulator'
          device=devices[0]['udid']
          subprocess.run(['xcrun','simctl','boot',device],check=False)
          subprocess.run(['xcrun','simctl','bootstatus',device,'-b'],check=True,timeout=600)
          subprocess.run(['xcrun','simctl','install',device,'build/probe/Build/Products/Debug-iphonesimulator/App.app'],check=True)
          with Path('probe-console.log').open('w') as output:
              child=subprocess.Popen(['xcrun','simctl','launch','--console',device,'com.sogrimhashbon.app'],stdout=output,stderr=subprocess.STDOUT)
              deadline=time.monotonic()+480
              while time.monotonic()<deadline:
                  text=Path("probe-console.log").read_text(errors="replace")
                  if "PROBE_CALLBACK_FINAL:" in text or child.poll() is not None: break
                  time.sleep(2)
              result={'launchExitCode':child.poll()}
              subprocess.run(['xcrun','simctl','io',device,'screenshot','probe-ipad.png'],check=False,timeout=30)
              child.terminate()
              try: child.wait(timeout=5)
              except subprocess.TimeoutExpired: child.kill()
          Path('probe-launch-status.json').write_text(json.dumps(result))
          raw=Path('probe-console.log').read_text(errors='replace').splitlines()
          lines=[line for line in raw if 'PROBE_CALLBACK' in line]
          Path('probe-sanitized.log').write_text('\n'.join(lines)+'\n')
          diagnostics=[re.sub(r'https?://\S+|eyJ[A-Za-z0-9_.-]+','[redacted]',line)[:500] for line in raw if any(marker in line for marker in ['Terminating app','exception','failed to launch']) and 'PROBE_CALLBACK' not in line][-10:]
          Path('probe-diagnostic.log').write_text('\n'.join(diagnostics)+'\n')
          print('\n'.join(lines))
          assert any('PROBE_CALLBACK_APPLE_BROWSER:true' in line for line in lines),'Actual Apple browser did not open'
          assert any('PROBE_CALLBACK_DELIVERED:true' in line for line in lines),'Actual Capacitor callback delivery was not accepted'
          final=[json.loads(line.partition('PROBE_CALLBACK_FINAL:')[2]) for line in lines if 'PROBE_CALLBACK_FINAL:' in line]
          assert len(final)==1,'Expected one final actual-SDK observation'
          state=final[0]
          assert state['proxyRetainsCallback'],'Actual iOS proxy did not retain its callback'
          if os.environ['PROBE_LABEL']=='before':
              assert state['reloads']>=2,'Released baseline did not reproduce repeated callback reloads'
          else:
              assert state['reloads']==1,'Fixed app must reload exactly once for the first native callback'
              assert state['retainedLaunch'],'Actual App.getLaunchUrl did not return the retained callback'
              assert state['ready'] and state['feedback'],'Provider rejection must leave visible feedback and a usable new Apple attempt'
              assert state['mark']=='./app-icon-exterior-192.png' and state['markLoaded'],'Actual iPad gate did not show the loaded current logo'
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ipad-native-apple-callback-${{ matrix.label }}
          path: |
            probe-sanitized.log
            probe-launch-status.json
            probe-diagnostic.log
            probe-ipad.png
          if-no-files-found: warn
          retention-days: 7
