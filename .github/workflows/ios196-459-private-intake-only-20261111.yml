name: iOS196 4.59 private intake only
run-name: iOS196 original signed bytes - final bindings required
on:
  push:
    branches: [codex/ios196-459-private-intake-20261111]
permissions:
  contents: read
  actions: read
concurrency:
  group: ios-testflight-${{ github.repository }}
  cancel-in-progress: false
jobs:
  upload-original:
    # Bound to the original successful successor signing run and exact encrypted
    # artifact; guards recheck source, all CI and zero distribution before upload.
    if: ${{ github.repository == 'yarinn12/sogrim-hashbon' && github.ref == 'refs/heads/codex/ios196-459-private-intake-20261111' && github.event_name == 'push' && github.run_attempt == 1 && github.event.created == true && github.event.before == '0000000000000000000000000000000000000000' && github.event.forced == false && github.event.deleted == false }}
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: app
    env:
      SOURCE_SHA: "6d7b90a1a15e4e6c2a5af3cf17558d993322f45e"
      SOURCE_TREE: "4d5792fee5cf5043f1528a38f70becf4697b3dc4"
      PWA_RELEASE: "532"
      SOURCE_QA_RUN: "43586734389"
      SOURCE_WINDOWS_QA_RUN: "43586734354"
      SOURCE_FONT_QA_RUN: "43586734326"
      SOURCE_AUTH_QA_RUN: "43586734332"
      SIGNING_TOOLS_SHA: "b12ac3ff4dc030a8c27d1e3037d785045e5ec6ed"
      SIGNED_RUN_ID: "43621803389"
      SIGNED_RUN_NUMBER: "1"
      SIGNED_JOB_ID: "132528922930"
      SIGNED_ARTIFACT_ID: "14124457546"
      SIGNED_ARTIFACT_SIZE: "13710155"
      SIGNED_IPA_SHA256: "df2ce559fcb504aeb9935da887ea97a03a4de9ec77904c1d6b9a08dad54223c8"
      SIGNED_IPA_SIZE: "12797258"
      SIGNED_ARTIFACT_ZIP_SHA256: "eb3f44d3c630f0cd0db94052087bd9f4774ae79f508c1b7aa47c906bd4d7fc94"
      SIGNED_CIPHERTEXT_SHA256: "f3853c9804f0c07fa390668e54cb3092ee26bd63dc1d6eb6a5db4cfa0cf88006"
      SIGNED_CIPHERTEXT_SIZE: "13705216"
      WORKFLOW_COMMIT: ${{ github.workflow_sha }}
      WORKFLOW_REF: ${{ github.workflow_ref }}
      APPLE_TEAM_ID: MA9S4L7WKS
      APPSTORE_ISSUER_ID: ${{ vars.APPSTORE_ISSUER_ID }}
      APPSTORE_API_KEY_ID: ${{ vars.APPSTORE_API_KEY_ID }}
      IOS_VERSION: '4.59'
      IOS_BUILD: '196'
    steps:
      - name: Checkout immutable intake controls only
        uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          path: release-tools
          persist-credentials: false
      - name: Select Node24 without application dependencies or cache
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Require every final immutable binding before checkout, keys or download
        id: bindings
        working-directory: ${{ github.workspace }}
        run: node "$GITHUB_WORKSPACE/release-tools/scripts/qa/ios-signing/intake-bindings.mjs"
      - name: Require original intake branch creation and two complete unfiltered histories
        id: intake_first_creation
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: node "$GITHUB_WORKSPACE/release-tools/scripts/qa/ios-signing/intake-first-creation-guard.mjs" --output "$RUNNER_TEMP/ios196-intake-first-creation-20261111"
      - name: Checkout frozen application source explicitly
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.bindings.outputs.source_sha }}
          path: app
          persist-credentials: false
      - name: Checkout exact original Nov5 signing controls explicitly
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.bindings.outputs.signing_tools_sha }}
          path: original-signing-tools
          persist-credentials: false
      - name: Load public release notes from the frozen source
        run: node "$GITHUB_WORKSPACE/release-tools/scripts/qa/ios-signing/load-release-notes.mjs"
      - name: Check release notes and certificate rejection controls before keys
        env:
          IOS_RELEASE_METADATA_FILE: ${{ github.workspace }}/app/docs/store-submission/app-store-metadata-he.json
        run: |
          set -euo pipefail
          node --test "$GITHUB_WORKSPACE/release-tools/scripts/qa/ios-signing/test-release-notes.mjs"
          python3 "$GITHUB_WORKSPACE/release-tools/scripts/qa/ios-signing/test-signing-certificate.py"
      - name: Check Nov5 origin, first-creation, source receipts and zero-distribution controls
        working-directory: ${{ github.workspace }}/release-tools
        run: |
          set -euo pipefail
          node --experimental-vm-modules --test scripts/qa/ios-signing/intake-guards.test.mjs tests/iosIntakeNov5Origin.test.mjs
          python3 scripts/qa/ios-signing/verify-original-archive.test.py
      - name: Require all four exact successful source CI runs before keys
        env:
          IOS_INTAKE_FIRST_CREATION_RECEIPT: ${{ steps.intake_first_creation.outputs.receipt_path }}
          IOS_INTAKE_FIRST_CREATION_SHA256: ${{ steps.intake_first_creation.outputs.receipt_sha256 }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node "$GITHUB_WORKSPACE/release-tools/scripts/qa/ios-signing/intake-source-guard.mjs" ci-only
          mv build/ios/source-ci-only.json build/ios/live-ci-before-download.json
      - name: Verify original Nov5 signing run, complete steps and immutable controls before keys
        env:
          GH_TOKEN: ${{ github.token }}
        run: node "$GITHUB_WORKSPACE/release-tools/scripts/qa/ios-signing/intake-origin-guard.mjs"
      - name: Require live manual distribution and unused196 before private access
        env:
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: node "$GITHUB_WORKSPACE/release-tools/scripts/qa/ios-signing/intake-distribution-guard.mjs" preflight
      - name: Download and verify the original encrypted bytes and public envelope
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node "$GITHUB_WORKSPACE/release-tools/scripts/qa/ios-signing/download-intake-artifact.mjs"
          python3 "$GITHUB_WORKSPACE/release-tools/scripts/qa/ios-signing/extract-intake-envelope.py"
      - name: Authenticate the same original archive with the existing key
        env:
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          node "$GITHUB_WORKSPACE/release-tools/scripts/qa/ios-signing/protect-artifact.mjs" decrypt \
            build/ios/original-encrypted "$RUNNER_TEMP/sogrim-original-release.tar"
      - name: Verify all three original firstCreation source receipts and original IPA without rebuilding
        run: python3 "$GITHUB_WORKSPACE/release-tools/scripts/qa/ios-signing/verify-original-archive.py"
      - name: Recheck exact source, original receipt and manual distribution before upload
        env:
          IOS_INTAKE_FIRST_CREATION_RECEIPT: ${{ steps.intake_first_creation.outputs.receipt_path }}
          IOS_INTAKE_FIRST_CREATION_SHA256: ${{ steps.intake_first_creation.outputs.receipt_sha256 }}
          GH_TOKEN: ${{ github.token }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          node "$GITHUB_WORKSPACE/release-tools/scripts/qa/ios-signing/intake-distribution-guard.mjs" preflight
          node "$GITHUB_WORKSPACE/release-tools/scripts/qa/ios-signing/intake-source-guard.mjs" before-upload
      - name: Upload only the same original IPA bytes
        uses: apple-actions/upload-testflight-build@v5
        with:
          app-path: app/build/ios/SogrimHashbon.ipa
          app-type: ios
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          wait-for-processing: 'false'
          backend: appstore-api
      - name: Verify Apple processing and Hebrew TestFlight notes
        env:
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: node scripts/complete-ios-testflight.mjs
      - name: Verify zero groups, zero individual testers and no store association
        env:
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: node "$GITHUB_WORKSPACE/release-tools/scripts/qa/ios-signing/intake-distribution-guard.mjs" postflight
      - name: Retain JSON intake receipts only
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ios195-intake-evidence-${{ github.run_id }}
          path: |
            app/build/ios/live-ci-before-download.json
            app/build/ios/upload-origin.json
            app/build/ios/intake-*.json
            app/build/ios/source-before-upload.json
            app/build/ios/original-artifact-before-upload.json
            app/build/ios/testflight-completion.json
          if-no-files-found: warn
          retention-days: 1
