name: Android cold-launch ABBA diagnostic

on:
  push:
    branches: [codex/android-cold-launch-abba-20261015]

permissions:
  contents: read

jobs:
  diagnostic:
    if: ${{ github.repository == 'yarinn12/sogrim-hashbon' && github.event_name == 'push' && github.ref == 'refs/heads/codex/android-cold-launch-abba-20261015' && github.workflow_ref == 'yarinn12/sogrim-hashbon/.github/workflows/android-cold-launch-abba-20261015.yml@refs/heads/codex/android-cold-launch-abba-20261015' && github.run_number == 1 && github.run_attempt == 1 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SOGRIM_DISABLE_PRIVATE_ENV_AUTOLOAD: "1"
      ANDROID_QA_DEVICE: emulator-5582
      ANDROID_QA_SOURCE: "59b599c24341e4659bce62b02c9d78fce3dd050d"
      ANDROID_DIAGNOSTIC_APP_SOURCE: "59b599c24341e4659bce62b02c9d78fce3dd050d"
      ANDROID_DIAGNOSTIC_TOOLS_CHECKOUT: ${{ github.workspace }}
    steps:
      - name: Checkout QA tools
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require one-shot scope and exact application source
        id: source
        env:
          APP_SHA: "59b599c24341e4659bce62b02c9d78fce3dd050d"
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = yarinn12/sogrim-hashbon
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF" = refs/heads/codex/android-cold-launch-abba-20261015
          test "$GITHUB_WORKFLOW_REF" = yarinn12/sogrim-hashbon/.github/workflows/android-cold-launch-abba-20261015.yml@refs/heads/codex/android-cold-launch-abba-20261015
          test "$GITHUB_RUN_NUMBER" = 1
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          [[ "$APP_SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$APP_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.source.outputs.sha }}
          path: app
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Prepare owned QA paths and source receipt
        working-directory: app
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ANDROID_QA_SOURCE"
          test -z "$(git status --porcelain)"
          mkdir -p artifacts/android-native-isolated scripts/qa
          test "$(git rev-parse 'HEAD^{tree}')" = 923542d64d696b633b1b694fe53a32be464ad735
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          git=lambda path,ref:subprocess.check_output(['git','-C',path,'rev-parse',ref],text=True).strip()
          tools=os.environ['GITHUB_WORKSPACE']; app=os.getcwd()
          assert git(tools,'HEAD') == os.environ['GITHUB_SHA']
          record={'appSource':git(app,'HEAD'),'appTree':git(app,'HEAD^{tree}'),'toolsSource':git(tools,'HEAD'),'toolsTree':git(tools,'HEAD^{tree}'),'workflowRef':os.environ['GITHUB_WORKFLOW_REF'],'run':os.environ['GITHUB_RUN_ID'],'attempt':os.environ['GITHUB_RUN_ATTEMPT'],'fixtureOnly':True,'nativeAcceptance':False}
          pathlib.Path('artifacts/android-native-isolated/diagnostic-origin.json').write_text(json.dumps(record,indent=2))
          PY
          cp -R "$GITHUB_WORKSPACE/scripts/qa/android-native-isolated" scripts/qa/
          printf '%s\n' "$GITHUB_SHA" > artifacts/android-native-isolated/qa-tools-source.txt
          echo "ANDROID_QA_AVD=sogrim_ci_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
          echo "ANDROID_AVD_HOME=$RUNNER_TEMP/android-native-avd" >> "$GITHUB_ENV"
          echo "ANDROID_USER_HOME=$RUNNER_TEMP/android-native-home" >> "$GITHUB_ENV"
          echo "ANDROID_EMULATOR_HOME=$RUNNER_TEMP/android-native-home" >> "$GITHUB_ENV"
          echo "ADB_VENDOR_KEYS=$RUNNER_TEMP/android-native-home/adbkey" >> "$GITHUB_ENV"
          echo "ANDROID_ADB_SERVER_PORT=5037" >> "$GITHUB_ENV"
          echo "ADB_SERVER_SOCKET=tcp:5037" >> "$GITHUB_ENV"
          echo "SOGRIM_ANDROID_SIGNING_PROPERTIES_FILE=$RUNNER_TEMP/android-native-no-upload.properties" >> "$GITHUB_ENV"
          echo "ADB_PATH=$ANDROID_HOME/platform-tools/adb" >> "$GITHUB_ENV"
      - name: Install actual Android emulator SDK and create an empty AVD
        working-directory: app
        run: |
          set -euo pipefail
          sdk_bin="$(dirname "$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -1)")"
          test -x "$sdk_bin/sdkmanager"
          "$sdk_bin/sdkmanager" --install 'platforms;android-36' 'build-tools;36.1.0' 'platform-tools' 'emulator' 'system-images;android-36.1;google_apis_playstore;x86_64' > artifacts/android-native-isolated/sdk.log 2>&1
          test ! -e "$ANDROID_AVD_HOME"
          mkdir -p "$ANDROID_AVD_HOME" "$ANDROID_USER_HOME"
          printf 'no\n' | "$sdk_bin/avdmanager" create avd -n "$ANDROID_QA_AVD" -k 'system-images;android-36.1;google_apis_playstore;x86_64' -d pixel_6 > artifacts/android-native-isolated/avd.log 2>&1
          python3 - <<'PY'
          import os, pathlib
          config=pathlib.Path(os.environ['ANDROID_AVD_HOME'])/(os.environ['ANDROID_QA_AVD']+'.avd')/'config.ini'
          values={'hw.cpu.ncore':'2','hw.ramSize':'4096','hw.lcd.width':'1080','hw.lcd.height':'2400','hw.lcd.density':'420','hw.keyboard':'yes','hw.camera.back':'none','hw.camera.front':'none','hw.gltransport':'asg'}
          rows=[line for line in config.read_text().splitlines() if line.split('=',1)[0].strip() not in values]
          config.write_text('\n'.join(rows+[key+' = '+value for key,value in values.items()])+'\n')
          PY
          grep -qFx 'hw.ramSize = 4096' "$ANDROID_AVD_HOME/$ANDROID_QA_AVD.avd/config.ini"
          grep -E '^hw\.(ramSize|cpu\.ncore) = ' "$ANDROID_AVD_HOME/$ANDROID_QA_AVD.avd/config.ini" > artifacts/android-native-isolated/avd-resources.txt
          cat artifacts/android-native-isolated/avd-resources.txt
      - name: Record actual host and guest DMA compatibility before emulator launch
        working-directory: app
        run: |
          set -euo pipefail
          node scripts/qa/android-native-isolated/renderer-capabilities.mjs snapshot
          node scripts/qa/android-native-isolated/gltransport.mjs snapshot
      - name: Prepare shared isolated key and fresh ADB server before first emulator launch
        working-directory: app
        run: |
          set -euo pipefail
          node scripts/qa/android-native-isolated/adb-key-preflight.mjs
      - name: Build synthetic WWW and clean actual Debug APK
        working-directory: app
        run: |
          set -euo pipefail
          test ! -e "$SOGRIM_ANDROID_SIGNING_PROPERTIES_FILE"
          npm ci > artifacts/android-native-isolated/npm.log 2>&1
          NODE_OPTIONS="--import=file://$PWD/scripts/qa/android-native-isolated/offline-build-config.mjs" npm run native:prepare > artifacts/android-native-isolated/www-build.log 2>&1
          node scripts/qa/android-native-isolated/prepare-fixture.mjs
          npx cap copy android > artifacts/android-native-isolated/cap-copy.log 2>&1
          node scripts/qa/android-native-isolated/observe-gradle-build.mjs \
            --cwd android --output artifacts/android-native-isolated/gradle-build-observation --source "$ANDROID_QA_SOURCE" \
            -- bash ./gradlew assembleDebug --no-daemon --max-workers=2 "-Duser.home=$ANDROID_USER_HOME" '-Dorg.gradle.jvmargs=-Xmx1536m'
          python3 scripts/qa/android-native-isolated/audit-apk.py "$PWD" "$ANDROID_QA_SOURCE"
          "$ANDROID_HOME/build-tools/36.1.0/aapt" dump badging android/app/build/outputs/apk/debug/app-debug.apk > artifacts/android-native-isolated/apk-badging.txt
          grep -q "package: name='com.sogrimhashbon.app.debug'" artifacts/android-native-isolated/apk-badging.txt
          "$ANDROID_HOME/build-tools/36.1.0/apksigner" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk > artifacts/android-native-isolated/debug-certificate.txt
      - name: Build and audit the derived minimal-content Debug control
        working-directory: app
        run: |
          set -euo pipefail
          mkdir -p artifacts/android-native-isolated/diagnostic-apks
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/android-native-isolated/diagnostic-apks/product.apk
          node "$GITHUB_WORKSPACE/scripts/qa/android-native-isolated/diagnostic/prepare-control.mjs"
          node scripts/qa/android-native-isolated/observe-gradle-build.mjs \
            --cwd android --output artifacts/android-native-isolated/control-gradle-observation --source "$ANDROID_QA_SOURCE" \
            -- bash ./gradlew assembleDebug --no-daemon --max-workers=2 "-Duser.home=$ANDROID_USER_HOME" '-Dorg.gradle.jvmargs=-Xmx1536m'
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/android-native-isolated/diagnostic-apks/control.apk
          node "$GITHUB_WORKSPACE/scripts/qa/android-native-isolated/diagnostic/apk-members.mjs" \
            "$PWD/artifacts/android-native-isolated/diagnostic-apks/product.apk" \
            "$PWD/artifacts/android-native-isolated/diagnostic-apks/control.apk" \
            "$GITHUB_WORKSPACE/scripts/qa/android-native-isolated/diagnostic/control-index.html" \
            "$PWD/artifacts/android-native-isolated/diagnostic-apks/manifest.json"
      - name: Boot only the owned AVD and disable its real networking
        working-directory: app
        run: |
          set -euo pipefail
          test -c /dev/kvm
          sudo setfacl -m "u:$USER:rw" /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -avd "$ANDROID_QA_AVD" -port 5582 -no-window -no-snapshot -no-audio -no-boot-anim -gpu swiftshader -feature GLDirectMem,HasSharedSlotsHostMemoryAllocator -verbose -memory 4096 -cores 2 > artifacts/android-native-isolated/emulator.log 2>&1 &
          echo "$!" > artifacts/android-native-isolated/emulator.pid
          # A failed emulator must produce diagnostics rather than leave ADB
          # waiting for a device until the entire job times out.
          timeout 240 "$ADB_PATH" -s "$ANDROID_QA_DEVICE" wait-for-device
          booted=0
          for n in $(seq 1 180); do
            if [[ "$("$ADB_PATH" -s "$ANDROID_QA_DEVICE" shell getprop sys.boot_completed | tr -d '\r')" = 1 ]]; then booted=1; break; fi
            sleep 1
          done
          test "$booted" = 1
          test "$("$ADB_PATH" -s "$ANDROID_QA_DEVICE" emu avd name | head -1 | tr -d '\r')" = "$ANDROID_QA_AVD"
          tr '\0' ' ' < "/proc/$(cat artifacts/android-native-isolated/emulator.pid)/cmdline" > artifacts/android-native-isolated/emulator-cmdline.txt
          printf '\n' >> artifacts/android-native-isolated/emulator-cmdline.txt
          grep -qF -- '-gpu swiftshader' artifacts/android-native-isolated/emulator-cmdline.txt
          grep -qF -- '-memory 4096 -cores 2' artifacts/android-native-isolated/emulator-cmdline.txt
          cat artifacts/android-native-isolated/emulator-cmdline.txt
          ANDROID_QA_EMULATOR_PID="$(cat artifacts/android-native-isolated/emulator.pid)" node --input-type=module -e 'import {writeFileSync} from "node:fs"; const {assertHostOwner}=await import(process.env.GITHUB_WORKSPACE+"/scripts/qa/android-native-isolated/trace-diagnostics.mjs"); const owner=assertHostOwner({emulatorPid:Number(process.env.ANDROID_QA_EMULATOR_PID),avd:process.env.ANDROID_QA_AVD,device:process.env.ANDROID_QA_DEVICE}); writeFileSync("artifacts/android-native-isolated/emulator-owner.json",JSON.stringify({source:process.env.ANDROID_QA_SOURCE,toolsSource:process.env.GITHUB_SHA,owner}),{flag:"wx"});'
          "$ADB_PATH" -s "$ANDROID_QA_DEVICE" shell cat /proc/meminfo > artifacts/android-native-isolated/guest-meminfo.txt
          cat /proc/meminfo > artifacts/android-native-isolated/host-meminfo.txt
          printf 'guest '; awk '/^MemTotal:/ {print; exit}' artifacts/android-native-isolated/guest-meminfo.txt
          printf 'host '; awk '/^MemTotal:/ {print; exit}' artifacts/android-native-isolated/host-meminfo.txt
          ANDROID_QA_EMULATOR_PID="$(cat artifacts/android-native-isolated/emulator.pid)" node scripts/qa/android-native-isolated/network-isolation.mjs
          "$ADB_PATH" -s "$ANDROID_QA_DEVICE" shell settings put secure show_ime_with_hard_keyboard 1
          ANDROID_QA_EMULATOR_PID="$(cat artifacts/android-native-isolated/emulator.pid)" node scripts/qa/android-native-isolated/launcher-preparation.mjs
          "$ADB_PATH" -s "$ANDROID_QA_DEVICE" install android/app/build/outputs/apk/debug/app-debug.apk
      - name: Require healthy owned Android system before diagnostic capture
        working-directory: app
        run: |
          set -euo pipefail
          ANDROID_QA_HEALTH_PHASE=before node scripts/qa/android-native-isolated/emulator-health.mjs
          ANDROID_QA_EMULATOR_PID="$(cat artifacts/android-native-isolated/emulator.pid)" node scripts/qa/android-native-isolated/renderer-capabilities.mjs verify
          ANDROID_QA_EMULATOR_PID="$(cat artifacts/android-native-isolated/emulator.pid)" node scripts/qa/android-native-isolated/gltransport.mjs verify
          # Keep every Native-run event even if a later force-stop closes an ANR dialog.
          "$ADB_PATH" -s "$ANDROID_QA_DEVICE" logcat -b all -v threadtime > artifacts/android-native-isolated/logcat-live.log 2>&1 &
          echo "$!" > artifacts/android-native-isolated/logcat-live.pid
          # Fix posture before capture; do not rotate or hold in any trial.
          "$ADB_PATH" -s "$ANDROID_QA_DEVICE" shell settings put system font_scale 1
          "$ADB_PATH" -s "$ANDROID_QA_DEVICE" shell settings put system accelerometer_rotation 0
          "$ADB_PATH" -s "$ANDROID_QA_DEVICE" shell wm user-rotation lock 0
          # Start diagnostics before the first cold launch; this does not accept Native QA.
          node "$GITHUB_WORKSPACE/scripts/qa/android-native-isolated/trace-diagnostics.mjs" start
      - name: Collect the fixed ABBA cold launches without Native acceptance
        working-directory: app
        run: |
          set -euo pipefail
          export ANDROID_QA_EMULATOR_PID="$(cat artifacts/android-native-isolated/emulator.pid)"
          export APKSIGNER_PATH="$ANDROID_HOME/build-tools/36.1.0/apksigner"
          export ANDROID_DIAGNOSTIC_APK_MANIFEST="$PWD/artifacts/android-native-isolated/diagnostic-apks/manifest.json"
          export ANDROID_DIAGNOSTIC_NETWORK_RECEIPT="$PWD/artifacts/android-native-isolated/network-isolation.json"
          export ANDROID_DIAGNOSTIC_V5_START_RECEIPT="$PWD/artifacts/android-native-isolated/trace-diagnostics/trace-start.json"
          export ANDROID_DIAGNOSTIC_CONTROL_INDEX="$GITHUB_WORKSPACE/scripts/qa/android-native-isolated/diagnostic/control-index.html"
          export ANDROID_DIAGNOSTIC_OUTPUT="$PWD/artifacts/android-native-isolated/diagnostic-abba"
          timeout --signal=TERM --kill-after=15s 12m node "$GITHUB_WORKSPACE/scripts/qa/android-native-isolated/diagnostic/one-shot.mjs"
      - name: Preserve diagnostics and stop only the owned AVD
        if: always()
        working-directory: app
        run: |
          mkdir -p artifacts/android-native-isolated
          # Finalize our trace/host observer on every failure before the original ANR gate.
          trace_status=0
          ANDROID_QA_JOB_STATUS="${{ job.status }}" node "$GITHUB_WORKSPACE/scripts/qa/android-native-isolated/trace-diagnostics.mjs" finish || trace_status=$?
          diagnostic_status=1
          if [[ -s artifacts/android-native-isolated/emulator.pid && -s artifacts/android-native-isolated/emulator-owner.json ]] && ANDROID_QA_EMULATOR_PID="$(cat artifacts/android-native-isolated/emulator.pid)" node --input-type=module -e 'import {readFileSync} from "node:fs"; const {assertHostOwner}=await import(process.env.GITHUB_WORKSPACE+"/scripts/qa/android-native-isolated/trace-diagnostics.mjs"); const prior=JSON.parse(readFileSync("artifacts/android-native-isolated/emulator-owner.json","utf8")); if(prior.source!==process.env.ANDROID_QA_SOURCE||prior.toolsSource!==process.env.GITHUB_SHA||prior.owner.pid!==Number(process.env.ANDROID_QA_EMULATOR_PID))throw new Error("Foreign launch owner"); assertHostOwner({emulatorPid:prior.owner.pid,avd:process.env.ANDROID_QA_AVD,device:process.env.ANDROID_QA_DEVICE},{expectedStartTicks:prior.owner.startTicks});'; then
            timeout 20 "$ADB_PATH" -s "$ANDROID_QA_DEVICE" logcat -b all -d -v threadtime > artifacts/android-native-isolated/logcat.txt 2>&1 || true
            timeout 10 "$ADB_PATH" -s "$ANDROID_QA_DEVICE" shell dumpsys activity lastanr > artifacts/android-native-isolated/last-anr.txt 2>&1 || true
            diagnostic_status=0
            ANDROID_QA_JOB_STATUS="${{ job.status }}" node scripts/qa/android-native-isolated/anr-diagnostics.mjs || diagnostic_status=$?
            timeout 15 "$ADB_PATH" -s "$ANDROID_QA_DEVICE" emu kill || true
          fi
          if [[ "$diagnostic_status" != 0 ]]; then exit "$diagnostic_status"; fi
          exit "$trace_status"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: android-cold-launch-abba-${{ github.sha }}
          path: |
            app/artifacts/android-native-isolated/
            app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
