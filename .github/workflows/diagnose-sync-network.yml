name: Isolated sync network diagnostics
on:
  push:
    branches: [codex/diagnose-offline-network-2026-09-30]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Observe offline and document replacement with unchanged application code
        run: npx playwright test --config playwright.sync.config.mjs e2e-sync/browser-error-recorder.spec.mjs e2e-sync/two-client.spec.mjs --grep 'diagnostic|network|unplanned CORS|application error|repayment plan changes' --repeat-each=2 --retries=0
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: offline-network-diagnostics
          path: |
            test-results-sync
            playwright-report-sync
          retention-days: 7
