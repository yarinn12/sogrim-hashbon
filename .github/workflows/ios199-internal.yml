name: iOS 4.59 (199) Internal TestFlight

on:
  push:
    branches: [codex/testflight-459-199-20261126]

permissions:
  contents: read
  actions: read

concurrency:
  group: ios-testflight-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build-and-upload:
    if: >-
      github.repository == 'yarinn12/sogrim-hashbon' &&
      github.ref == 'refs/heads/codex/testflight-459-199-20261126' &&
      github.event.created && !github.event.deleted && !github.event.forced &&
      github.run_number == 1 && github.run_attempt == 1
    runs-on: macos-26
    timeout-minutes: 75
    defaults:
      run:
        working-directory: app
    env:
      SOURCE_SHA: e26e81f71e7858e173ed609ae81212b6bade3e76
      SOURCE_TREE: e23308d674c837386695d337c99e06fa160d9e19
      SOURCE_BRANCH: codex/test-459-20261123
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      APPSTORE_ISSUER_ID: ${{ vars.APPSTORE_ISSUER_ID }}
      APPSTORE_API_KEY_ID: ${{ vars.APPSTORE_API_KEY_ID }}
      GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
      GOOGLE_IOS_CLIENT_ID: ${{ vars.GOOGLE_IOS_CLIENT_ID }}
      IOS_PROVISIONING_PROFILE: Sogrim Hashbon App Store 2026
      IOS_VERSION: '4.59'
      IOS_BUILD: '199'
      IOS_RELEASE_NOTES: >-
        תיקוני סנכרון הוצאות ועדכון חיווי השמירה לאחר אישור השרת.
        שיפור יציבות מסך הפתיחה באייפון ושיתוף מהיר יותר של קישורים לאירועים בוואטסאפ.

    steps:
      - name: Checkout reviewed release tools
        uses: actions/checkout@v6
        with:
          path: tools
          persist-credentials: false

      - name: Checkout the tested application source
        uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_SHA }}
          path: app
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Verify source and all four CI runs before accessing Apple credentials
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$SOURCE_TREE"
          node scripts/verify-release-ci.mjs --sha "$SOURCE_SHA" --candidate-branch "$SOURCE_BRANCH"

      - name: Validate Apple configuration
        run: node scripts/verify-ios-workflow-env.mjs
        env:
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          APPSTORE_CERTIFICATES_FILE_BASE64: ${{ secrets.APPSTORE_CERTIFICATES_FILE_BASE64 }}
          APPSTORE_CERTIFICATES_PASSWORD: ${{ secrets.APPSTORE_CERTIFICATES_PASSWORD }}

      - name: Confirm build number 199 is not already present in the existing Apple app
        env:
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          node --input-type=module <<'NODE'
          import { createAppStoreClient } from './scripts/lib/app-store-release.mjs';
          const request = createAppStoreClient({
            issuerId: process.env.APPSTORE_ISSUER_ID,
            keyId: process.env.APPSTORE_API_KEY_ID,
            privateKey: process.env.APPSTORE_API_PRIVATE_KEY,
          });
          const apps = await request('/v1/apps?filter%5BbundleId%5D=com.sogrimhashbon.app&limit=2');
          const app = apps.data?.[0];
          if (apps.links?.next || apps.data?.length !== 1 || app.id !== '6809952514' ||
              app.attributes?.bundleId !== 'com.sogrimhashbon.app') {
            throw new Error('App Store Connect returned an unexpected app');
          }
          const query = new URLSearchParams({ 'filter[app]': app.id, 'filter[version]': process.env.IOS_BUILD, limit: '2' });
          const builds = await request(`/v1/builds?${query}`);
          if (!Array.isArray(builds.data) || builds.links?.next || builds.data.length !== 0) {
            throw new Error('TestFlight build number is already in use or could not be verified');
          }
          NODE

      - name: Verify Apple login readiness
        run: npm run qa:ios:providers

      - name: Select Xcode 26.6
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Prepare and verify the release assets
        run: |
          npm ci
          npm run native:ios:flatten-icon
          npm run native:prepare
          node scripts/prepare-ios-release.mjs
          xcodebuild -help > "$RUNNER_TEMP/xcodebuild-help.txt" 2>&1 || true
          grep -q 'testFlightInternalTestingOnly' "$RUNNER_TEMP/xcodebuild-help.txt"
          plutil -insert testFlightInternalTestingOnly -bool YES ios/ExportOptions.generated.plist
          npm run qa:ios

      - name: Import the existing Apple Distribution certificate
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.APPSTORE_CERTIFICATES_FILE_BASE64 }}
          p12-password: ${{ secrets.APPSTORE_CERTIFICATES_PASSWORD }}

      - name: Download the existing provisioning profile
        uses: apple-actions/download-provisioning-profiles@v6
        with:
          bundle-id: com.sogrimhashbon.app
          profile-type: IOS_APP_STORE
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}

      - name: Archive and export signed iOS build
        run: |
          set -euo pipefail
          mkdir -p build/ios
          xcodebuild -resolvePackageDependencies -project ios/App/App.xcodeproj -scheme App
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/ios/SogrimHashbon.xcarchive \
            clean archive DEVELOPMENT_TEAM="$APPLE_TEAM_ID"
          xcodebuild -exportArchive -archivePath build/ios/SogrimHashbon.xcarchive \
            -exportOptionsPlist ios/ExportOptions.generated.plist -exportPath build/ios/export
          ipa_path="$(find build/ios/export -maxdepth 2 -name '*.ipa' -print -quit)"
          test -n "$ipa_path"
          cp "$ipa_path" build/ios/SogrimHashbon.ipa

      - name: Verify signed IPA and compare its application content with Android build 195
        run: |
          npm run qa:ios:artifact
          python3 - "$GITHUB_WORKSPACE/tools" <<'PY'
          import hashlib, json, runpy, sys
          from pathlib import Path
          tools = Path(sys.argv[1]) / 'test-release'
          helper = runpy.run_path(str(tools / 'verify-mobile-web-parity.py'))
          assets = helper['archive_hashes'](Path('build/ios/SogrimHashbon.ipa'), ios=True)
          content = {name: row['content'] for name, row in assets.items()}
          encoded = json.dumps(content, sort_keys=True, separators=(',', ':'), ensure_ascii=True).encode()
          expected = json.loads((tools / 'android-web-reference.json').read_text(encoding='utf-8'))
          if expected['source'] != 'e26e81f71e7858e173ed609ae81212b6bade3e76' or len(assets) != 286 or hashlib.sha256(encoded).hexdigest() != expected['content_sha256']:
              raise SystemExit('Signed iOS web assets do not match the verified Android content')
          print(f'Verified {len(assets)} matching application assets before TestFlight upload')
          PY

      - name: Upload build to TestFlight
        uses: apple-actions/upload-testflight-build@v5
        with:
          app-path: app/build/ios/SogrimHashbon.ipa
          app-type: ios
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          wait-for-processing: 'false'
          backend: appstore-api

      - name: Verify Apple processing and confirm TestFlight release notes
        run: node scripts/complete-ios-testflight.mjs
        env:
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
